<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 실패 - 아무래도 안경</title>
    <link rel="icon" href="/static/img/icon.webp" type="image/webp">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #162a45, #0a1424);
            color: #fff;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }

        .fail-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 50px 40px;
            width: 100% !important;
            max-width: none !important;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            margin: 0 !important;
            
            /* 기본: PC (공백 3, 안내 요소 6, 공백 3) */
            grid-column: 4 / span 6 !important;
            grid-row: 2 !important;
            align-self: start;
        }

        .icon-container {
            width: 80px;
            height: 80px;
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid rgba(239, 68, 68, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px auto;
            animation: pulse 2s infinite;
        }

        .fail-icon {
            font-size: 2.5rem;
            color: #ef4444;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #f3f4f6;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1rem;
            color: #9ca3af;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        /* 상세 에러 정보 박스 */
        .error-info-box {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 40px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .info-row {
            display: flex;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            width: 90px;
            color: #6b7280;
            font-weight: 700;
        }

        .info-value {
            flex: 1;
            color: #e5e7eb;
            word-break: break-all;
        }

        /* 액션 버튼 */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-primary {
            background: #2563eb;
            color: #fff;
            border: none;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }
        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: #d1d5db;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        @media screen and (max-width: 1024px) {
            .fail-card {
                /* 와일드 모바일: 공백 1, 안내 요소 4, 공백 1 */
                grid-column: 2 / span 4 !important;
                grid-row: 2 !important;
            }
        }
        
        @media screen and (max-width: 640px) {
            .fail-card {
                /* 모바일: 안내 요소 4 */
                grid-column: 1 / span 4 !important;
                grid-row: 2 !important;
                padding: 40px 20px !important;
            }
            .title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div id="paymentResultView" class="main-grid-layout" style="display: grid; min-height: 100vh; padding-bottom: 50px; box-sizing: border-box;">
        <div class="fail-card">
        <div class="icon-container">
            <span class="fail-icon">✕</span>
        </div>
        <h1 class="title">결제를 완료하지 못했습니다</h1>
        <p class="subtitle">결제 진행 중 오류가 발생했거나<br>사용자에 의해 결제 요청이 취소되었습니다.</p>

        <!-- 상세 정보 박스 -->
        <div class="error-info-box">
            <div class="info-row" id="orderIdRow" style="display: none;">
                <span class="info-label">주문 번호</span>
                <span class="info-value" id="orderIdVal"></span>
            </div>
            <div class="info-row">
                <span class="info-label">실패 사유</span>
                <span class="info-value" id="errorMsgVal">알 수 없는 에러가 발생했습니다.</span>
            </div>
        </div>

        <!-- 버튼 그룹 -->
        <div class="btn-group">
            <button class="btn btn-primary" onclick="window.history.go(-2);">다시 결제하기</button>
            <a href="/" class="btn btn-secondary">홈으로 이동</a>
        </div>
    </div>
</div>

    <!-- 공통 푸터(Footer): 사업자 정보 -->
    <footer class="main-footer">
        <hr class="footer-divider">
        <div class="footer-info">
            <p class="footer-terms-wrap">
                <a href="/about" class="footer-terms-link">about us</a>
                    <span style="color: #ccc; margin: 0 8px;">|</span>
                    <a href="/static/terms.html" class="footer-terms-link">이용약관</a> 
                <span style="color: #ccc; margin: 0 8px;">|</span> 
                <a href="/static/privacy.html" class="footer-terms-link">개인정보처리방침</a>
            </p>
            <p>상호명 및 호스트 서비스 제공 : 주식회사 키제이</p>
            <p>대표 : 서명원 / 연락처 : 070-8064-4598</p>
            <p>email : amuredo_shop@naver.com</p>
            <p>서울시 관악구 난곡로 128, 1층</p>
            <p>사업자 등록 번호 : 257-87-03297</p>
            <p>통신판매업 신고 : 2026-서울관악-0029</p>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const message = urlParams.get("message");
            const orderId = urlParams.get("orderId");

            if (message) {
                document.getElementById("errorMsgVal").textContent = decodeURIComponent(message);
            }
            if (orderId) {
                document.getElementById("orderIdRow").style.display = "flex";
                document.getElementById("orderIdVal").textContent = orderId;
            }
        });
    </script>
</body>
</html>
