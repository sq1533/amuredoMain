<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 검색엔진 최적화 (SEO) -->
    <title>About - amuredo</title>
    <meta name="description" content="amuredo의 브랜드 철학과 아이덴티티를 소개합니다.">
    
    <link rel="stylesheet" href="/static/style.css?v=8.0">
</head>
<body>
    <div class="app-container">
        
        <!-- 최상단 헤더(Header) 영역: 모든 페이지 공통 레이아웃 구조체 -->
        <header class="main-header">
            <div class="logo-wrapper">
                <img src="https://via.placeholder.com/256x128.png?text=amuredo" alt="amuredo Logo" class="logo" style="cursor: pointer;" onclick="location.href='/'">
            </div>

            <!-- 모바일 전용 햄버거 메뉴 버튼 -->
            <button class="menu-toggle-btn" id="menuToggleBtn" aria-label="메뉴 열기">
                <span class="hamburger-box"></span>
            </button>

            <!-- 640px 이하 모바일 토스트 / 데스크탑 가로 나열 네비게이션 트리 -->
            <nav class="page-nav" id="pageNav">
                <button class="close-menu-btn" id="closeMenuBtn" aria-label="메뉴 닫기">✕</button>
                <ul class="nav-links">
                    <li><button class="nav-switch-btn" onclick="location.href='/sunglasses'">Sunglasses</button></li>
                    <li><button class="nav-switch-btn" onclick="location.href='/glasses'">Glasses</button></li>
                    <li><button class="nav-switch-btn" onclick="location.href='/goggles'">Goggles</button></li>
                    <li><button class="nav-switch-btn" onclick="location.href='/about'">about</button></li>
                    <li><button class="nav-switch-btn" onclick="location.href='/contact'">문의하기</button></li>
                </ul>
            </nav>
            <div class="nav-overlay" id="navOverlay"></div>
        </header>

        <!-- About 메인 컨텐츠 영역 -->
        <main class="about-main">
            <!-- 1. 거대한 브랜드 히어로 이미지 배너 -->
            <section class="about-hero fade-in-section">
                <!-- 가로 100%, 강렬한 흑백 대비 혹은 브랜드 심볼 사진 -->
                <img src="https://via.placeholder.com/1200x800.png?text=amuredo+Philosophy" alt="About Amuredo" class="about-hero-img">
                <div class="about-hero-text">
                    <h1>The Vision</h1>
                    <p>Redefining Eyewear Excellence.</p>
                </div>
            </section>

            <!-- 2. 프리미엄 철학 및 스토리 영역 (모바일/PC 반응형, 여백 극대화 레이아웃) -->
            <section class="about-philosophy fade-in-section">
                <h2>Our Story</h2>
                <div class="philosophy-content">
                    <p>
                        amuredo는 단순한 시력 보조 도구를 넘어,<br> 
                        개인의 분위기와 억양을 디자인하는 프리미엄 아이웨어 브랜드입니다.
                    </p>
                    <p>
                        모든 실루엣의 곡선은 수많은 연구 끝에 탄생했으며, <br>
                        빛의 반사와 그림자까지 고려하여 가장 우아한 형태를 만듭니다.<br>
                        과도한 장식을 버리고, 오직 본질의 아름다움만을 추구합니다.
                    </p>
                    <p class="signature-text">- amuredo Design Studio</p>
                </div>
            </section>
        </main>
        
    </div>

    <!-- 네비게이션 드로어 & 애니메이션 로직 -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. 공통 메뉴 동작 (open 상태 스위칭)
            const menuBtn = document.getElementById("menuToggleBtn");
            const closeBtn = document.getElementById("closeMenuBtn");
            const pageNav = document.getElementById("pageNav");
            const navOverlay = document.getElementById("navOverlay");

            function toggleMenu() {
                pageNav.classList.toggle("open");
                navOverlay.classList.toggle("active");
            }

            if(menuBtn) menuBtn.addEventListener("click", toggleMenu);
            if(closeBtn) closeBtn.addEventListener("click", toggleMenu);
            if(navOverlay) navOverlay.addEventListener("click", toggleMenu);

            // 2. 부드러운 스크롤 페이드인(Fade-in) 마이크로 애니메이션 트래킹
            const fadeElements = document.querySelectorAll(".fade-in-section");
            const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("is-visible");
                        obs.unobserve(entry.target); 
                    }
                });
            }, { 
                threshold: 0.2, // 20% 정도 뷰포트에 들어오면 작동
            });

            fadeElements.forEach(el => observer.observe(el));
        });
    </script>
</body>
</html>
