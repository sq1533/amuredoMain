    <!-- 공통 메뉴 동작용 스크립트 -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const menuToggleBtn = document.getElementById("menuToggleBtn");
            const closeMenuBtn = document.getElementById("closeMenuBtn");
            const pageNav = document.getElementById("pageNav");
            const navOverlay = document.getElementById("navOverlay");

            function toggleMenu() {
                pageNav.classList.toggle("open");
                navOverlay.classList.toggle("active");
            }

            if(menuToggleBtn) menuToggleBtn.addEventListener("click", toggleMenu);
            if(closeMenuBtn) closeMenuBtn.addEventListener("click", toggleMenu);
            if(navOverlay) navOverlay.addEventListener("click", toggleMenu);
        });
    </script>

    <!-- 🏁 B2B 전용 장바구니 스크립트 -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const qtyInput = document.getElementById("qtyInput");
            const qtyMinusBtn = document.getElementById("qtyMinusBtn");
            const qtyPlusBtn = document.getElementById("qtyPlusBtn");
            const addToCartBtn = document.getElementById("addToCartBtn");

            if (!qtyInput || !addToCartBtn) return;

            // 크롬 화살표 제거 CSS (JS로 삽입)
            const style = document.createElement('style');
            style.innerHTML = `
                input[type=number]::-webkit-inner-spin-button, 
                input[type=number]::-webkit-outer-spin-button { 
                    -webkit-appearance: none; 
                    margin: 0; 
                }
            `;
            document.head.appendChild(style);

            // 수량 포맷 및 제한 강제 적용 (10단위, 10~200)
            function formatQuantity() {
                let val = parseInt(qtyInput.value) || 0;
                val = Math.round(val / 10) * 10;
                if (val < 10) val = 10;
                if (val > 200) val = 200;
                qtyInput.value = val;
            }

            qtyMinusBtn.addEventListener("click", () => {
                let val = parseInt(qtyInput.value) || 0;
                qtyInput.value = val - 10;
                formatQuantity();
            });

            qtyPlusBtn.addEventListener("click", () => {
                let val = parseInt(qtyInput.value) || 0;
                qtyInput.value = val + 10;
                formatQuantity();
            });

            // 수동 입력 시 포커스 해제되거나 엔터 칠 때 10단위 강제 맞춤
            qtyInput.addEventListener("blur", formatQuantity);
            qtyInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    formatQuantity();
                }
            });

            // 장바구니 담기
            addToCartBtn.addEventListener("click", () => {
                // 🏁 장바구니 담기 시점에 백엔드 세션 실시간 크로스체크
                fetch("/api/user/status")
                    .then(res => res.json())
                    .then(data => {
                        if (data.is_wholesale) {
                            // 1. 도매 고객으로 정상 인증된 경우 -> 기존의 장바구니 쿠키 저장 처리 진행
                            formatQuantity();
                            const qty = parseInt(qtyInput.value);
                            const itemName = document.getElementById("detailItemName").textContent;
                            const priceText = document.getElementById("detailItemPrice").textContent;
                            
                            // 가격에서 쉼표나 ₩ 기호 등을 제외한 순수 숫자만 추출
                            const priceStr = priceText.replace(/[^0-9]/g, '');
                            const unitPrice = parseInt(priceStr) || 0;
                            
                            // URL 구조에서 아이템 ID 추출 (예: /antioch/item123)
                            const pathParts = window.location.pathname.split('/');
                            const itemId = pathParts[pathParts.length - 1];

                            const cartItem = {
                                id: itemId,
                                name: itemName,
                                unit_price: unitPrice,
                                quantity: qty,
                                total_price: unitPrice * qty
                            };

                            // 기존 쿠키 불러오기
                            let cart = [];
                            const match = document.cookie.match(new RegExp('(^| )wholesale_cart=([^;]+)'));
                            if (match) {
                                try {
                                    cart = JSON.parse(decodeURIComponent(match[2]));
                                } catch(e) {}
                            }

                            // 동일한 상품이 장바구니에 있으면 수량만 추가 (최대 200개 제한)
                            const existingIndex = cart.findIndex(item => item.id === itemId);
                            if (existingIndex > -1) {
                                cart[existingIndex].quantity += qty;
                                if (cart[existingIndex].quantity > 200) cart[existingIndex].quantity = 200;
                                cart[existingIndex].total_price = cart[existingIndex].quantity * cart[existingIndex].unit_price;
                            } else {
                                cart.push(cartItem);
                            }

                            // 쿠키 갱신 (유효기간 30일)
                            document.cookie = `wholesale_cart=${encodeURIComponent(JSON.stringify(cart))}; path=/; max-age=2592000`;
                            
                            // 커스텀 성공 팝업 노출
                            showCartToast();
                        } else {
                            // 2. 도매 고객이 아니거나 로그아웃 상태인 경우 -> 로그인 유도 프리미엄 모달 팝업 작동
                            showLoginRedirectModal();
                        }
                    })
                    .catch(err => {
                        console.error("도매 상태 검증 오류:", err);
                        alert("회원 인증 확인 과정에서 오류가 발생했습니다. 다시 시도해 주세요.");
                    });
            });

            // 🏁 도매 로그인 페이지 유도 프리미엄 모달 팝업
            function showLoginRedirectModal() {
                let modal = document.getElementById("loginRedirectModal");
                if (!modal) {
                    document.body.insertAdjacentHTML("beforeend", `
                        <div id="loginRedirectModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 11000; justify-content: center; align-items: center; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);">
                            <div class="ws-modal-content" style="background: white; padding: 40px 30px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); width: 340px; text-align: center; transform: translateY(-20px); animation: wsModalFadeIn 0.3s forwards;">
                                <div style="font-size: 2.8rem; margin-bottom: 15px;">🔒</div>
                                <div style="font-size: 1.3rem; font-weight: 800; color: #0e3a5b; margin-bottom: 12px; word-break: keep-all;">B2B 파트너 전용</div>
                                <div style="font-size: 0.95rem; color: #666; margin-bottom: 30px; line-height: 1.6; word-break: keep-all;">도매 파트너 승인 계정으로 로그인 후<br>장바구니 담기 및 구매가 가능합니다.<br><br>로그인 페이지로 이동하시겠습니까?</div>
                                <div style="display: flex; gap: 10px;">
                                    <button id="redirectModalCloseBtn" style="flex: 1; padding: 14px; background: #f1f3f5; color: #555; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='#e2e6ea'" onmouseout="this.style.background='#f1f3f5'">취소</button>
                                    <button id="redirectModalConfirmBtn" style="flex: 1; padding: 14px; background: #0e3a5b; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='#0b2d47'" onmouseout="this.style.background='#0e3a5b'">로그인 하기</button>
                                </div>
                            </div>
                        </div>
                    `);
                    modal = document.getElementById("loginRedirectModal");
                }
                modal.style.display = "flex";

                document.getElementById("redirectModalConfirmBtn").onclick = () => {
                    window.location.href = "/login";
                };
                document.getElementById("redirectModalCloseBtn").onclick = () => {
                    modal.style.display = "none";
                };
            }

            // 🏁 장바구니 커스텀 팝업(Toast) 로직
            function showCartToast() {
                // 기존 팝업이 있다면 제거
                const oldToast = document.getElementById("cartToast");
                if (oldToast) oldToast.remove();

                const toast = document.createElement("div");
                toast.id = "cartToast";
                // 공통 스타일은 유지하되 애니메이션 충돌 방지를 위해 transition만 따로 설정
                toast.className = "ws-modal-content"; 
                toast.style.cssText = `
                    position: fixed;
                    top: 55%; /* 시작 위치 (살짝 아래) */
                    left: 50%;
                    transform: translate(-50%, -50%);
                    z-index: 10000;
                    opacity: 0;
                    transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
                    animation: none; /* 공통 클래스의 애니메이션 제거 */
                `;

                toast.innerHTML = `
                    <div style="font-size: 3rem; margin-bottom: 15px;">🛒</div>
                    <div style="font-size: 1.2rem; font-weight: 800; color: #0e3a5b; margin-bottom: 8px;">장바구니에 담았어요!</div>
                    <div style="font-size: 0.9rem; color: #666; margin-bottom: 20px;">우측 메뉴에서 장바구니를 확인해보세요.</div>
                    <button onclick="this.parentElement.remove()" style="padding: 10px 25px; background: #0e3a5b; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; transition: background 0.2s;" onmouseover="this.style.background='#0b2d47'" onmouseout="this.style.background='#0e3a5b'">확인</button>
                `;

                document.body.appendChild(toast);

                // 애니메이션 효과: 중앙을 유지하며 부드럽게 위로 솟아오름
                setTimeout(() => {
                    toast.style.opacity = "1";
                    toast.style.top = "50%";
                }, 50);

                // 3.5초 후 자동 소멸
                setTimeout(() => {
                    if (toast.parentElement) {
                        toast.style.opacity = "0";
                        toast.style.top = "45%";
                        setTimeout(() => toast.remove(), 400);
                    }
                }, 3500);
            }
        });
    </script>
    

<script src="/static/globalWholesale.js?v=1.1"></script>
