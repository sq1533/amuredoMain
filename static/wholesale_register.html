<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도매 회원가입 - 아무래도 안경</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="/static/style.css?v=14.32">
    <style>
        .wholesale-container {
            max-width: 500px;
            margin: 100px auto;
            padding: 40px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .wholesale-title {
            font-size: 2rem;
            font-weight: 700;
            color: #0e3a5b;
            margin-bottom: 10px;
            text-align: center;
        }
        .wholesale-subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 40px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #0e3a5b;
        }
        .file-upload-wrapper {
            position: relative;
            margin-top: 10px;
        }
        .custom-file-label {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 20px;
            background: #f4f4f4;
            color: #333;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s;
            text-align: center;
        }
        .custom-file-label:hover {
            background: #e9e9e9;
        }
        #images {
            display: none;
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: #0e3a5b;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .file-preview-container {
            margin-top: 10px;
        }
        .file-info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: #666;
        }
        .login-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .login-link:hover {
            text-decoration: underline;
        }
        .feedback-text {
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }
        .text-green { color: #28a745; }
        .text-red { color: #dc3545; }
    </style>
</head>
<body>
    <div class="wholesale-container">
        <h1 class="wholesale-title">Antioch Wholesale</h1>
        <p class="wholesale-subtitle">도매 가입 신청을 위해 사업자 정보를 입력해 주세요.</p>

        <form id="registerForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">대표자명</label>
                <input type="text" id="name" name="name" placeholder="대표자 성함을 입력하세요" required>
            </div>
            <div class="form-group">
                <label for="email">이메일 (ID로 사용)</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>
            <div class="form-group">
                <label for="password">비밀번호 <span style="font-size: 0.8rem; font-weight: normal; color: #666;">(영문, 숫자 필수 / 특수문자 선택 / 6~12자리)</span></label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
                <div id="pwdRuleFeedback" class="feedback-text"></div>
            </div>
            <div class="form-group">
                <label for="password_confirm">비밀번호 확인</label>
                <input type="password" id="password_confirm" placeholder="비밀번호를 다시 입력하세요" required>
                <div id="pwdConfirmFeedback" class="feedback-text"></div>
            </div>
            <div class="form-group">
                <label for="business_number">사업자 등록 번호</label>
                <input type="text" id="business_number" name="business_number" placeholder="000-00-00000" required>
            </div>
            <div class="form-group">
                <label>사업자 등록증 첨부</label>
                <div class="file-upload-wrapper">
                    <label for="images" class="custom-file-label">파일 선택</label>
                    <input type="file" id="images" name="business_license" accept="image/*" required>
                    <div id="filePreview" class="file-preview-container"></div>
                </div>
            </div>
            <button type="submit" id="submitBtn" class="submit-btn">가입 신청하기</button>
        </form>
        <a href="/wholesale/login" class="login-link">이미 계정이 있으신가요? 로그인하기</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const registerForm = document.getElementById("registerForm");
            const imageInput = document.getElementById("images");
            const filePreview = document.getElementById("filePreview");
            const submitBtn = document.getElementById("submitBtn");
            const passwordInput = document.getElementById("password");
            const passwordConfirmInput = document.getElementById("password_confirm");
            const businessInput = document.getElementById("business_number");
            const pwdRuleFeedback = document.getElementById("pwdRuleFeedback");
            const pwdConfirmFeedback = document.getElementById("pwdConfirmFeedback");

            // 사업자 등록 번호 UX: 숫자만 추출하여 000-00-00000 형태로 자동 변환
            businessInput.addEventListener("input", (e) => {
                let val = e.target.value.replace(/[^0-9]/g, ''); // 숫자만 남기기
                if (val.length > 10) val = val.substring(0, 10); // 최대 10자리 제한

                let formatted = val;
                if (val.length > 5) {
                    formatted = val.substring(0, 3) + '-' + val.substring(3, 5) + '-' + val.substring(5);
                } else if (val.length > 3) {
                    formatted = val.substring(0, 3) + '-' + val.substring(3);
                }
                e.target.value = formatted;
            });

            // 비밀번호 정규식: 영문(대소문자), 숫자 필수 / 특수문자(!@#$%^&*) 선택 / 6~12자리
            const pwdRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d!@#$%^&*]{6,12}$/;

            function checkPasswordRules() {
                const pwd = passwordInput.value;
                pwdRuleFeedback.style.display = "block";
                
                if (pwd.length === 0) {
                    pwdRuleFeedback.style.display = "none";
                    return false;
                }
                
                if (pwdRegex.test(pwd)) {
                    pwdRuleFeedback.textContent = "사용 가능한 비밀번호입니다.";
                    pwdRuleFeedback.className = "feedback-text text-green";
                    return true;
                } else {
                    pwdRuleFeedback.textContent = "영문/숫자 필수, 6~12자리, 특수문자는 !@#$%^&*만 가능합니다.";
                    pwdRuleFeedback.className = "feedback-text text-red";
                    return false;
                }
            }

            function checkPasswordMatch() {
                const pwd = passwordInput.value;
                const confirmPwd = passwordConfirmInput.value;
                pwdConfirmFeedback.style.display = "block";

                if (confirmPwd.length === 0) {
                    pwdConfirmFeedback.style.display = "none";
                    return false;
                }

                if (pwd === confirmPwd) {
                    pwdConfirmFeedback.textContent = "비밀번호가 일치합니다.";
                    pwdConfirmFeedback.className = "feedback-text text-green";
                    return true;
                } else {
                    pwdConfirmFeedback.textContent = "비밀번호가 일치하지 않습니다.";
                    pwdConfirmFeedback.className = "feedback-text text-red";
                    return false;
                }
            }

            passwordInput.addEventListener("input", () => {
                checkPasswordRules();
                if (passwordConfirmInput.value.length > 0) {
                    checkPasswordMatch();
                }
            });

            passwordConfirmInput.addEventListener("input", checkPasswordMatch);

            // 파일 선택 시 피드백 및 용량 제한 (5MB)
            imageInput.addEventListener("change", (e) => {
                filePreview.innerHTML = "";
                const file = e.target.files[0];
                if (file) {
                    // 5MB 용량 제한
                    if (file.size > 5 * 1024 * 1024) {
                        alert("5MB 이하의 이미지만 첨부 가능합니다.");
                        imageInput.value = ""; // 선택 초기화
                        return;
                    }
                    
                    const itemWrap = document.createElement("div");
                    itemWrap.className = "file-info-item";
                    itemWrap.innerHTML = `<span>📄 ${file.name}</span>`;
                    filePreview.appendChild(itemWrap);
                }
            });

            // 폼 제출
            registerForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                
                if (!checkPasswordRules()) {
                    alert("비밀번호 규칙을 확인해 주세요.");
                    passwordInput.focus();
                    return;
                }
                
                if (!checkPasswordMatch()) {
                    alert("비밀번호가 일치하지 않습니다.");
                    passwordConfirmInput.focus();
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerText = "신청 중...";

                const formData = new FormData(registerForm);
                
                // 백엔드로 보낼 때 사업자 등록 번호의 하이픈 제거 (숫자 10자리만 전송)
                const rawBizNum = formData.get("business_number").replace(/-/g, '');
                if (rawBizNum.length !== 10) {
                    alert("사업자 등록 번호 10자리를 정확히 입력해 주세요.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "가입 신청하기";
                    businessInput.focus();
                    return;
                }
                formData.set("business_number", rawBizNum);

                try {
                    const response = await fetch("/api/user/register", {
                        method: "POST",
                        body: formData
                    });
                    const result = await response.json();

                    if (result.status === "success") {
                        alert(result.message);
                        location.href = "/wholesale/login";
                    } else {
                        alert(result.message);
                    }
                } catch (error) {
                    alert("서버 통신 중 오류가 발생했습니다.");
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "가입 신청하기";
                }
            });
        });
    </script>
<script src="/static/globalWholesale.js?v=1.0"></script>
</body>
</html>
