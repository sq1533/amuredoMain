<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 완료 - 아무래도 안경</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="/static/style.css?v=16.0">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .success-container {
            background: #ffffff;
            padding: 60px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 450px;
            width: 90%;
            animation: slideUpFadeIn 0.5s ease-out forwards;
        }
        @keyframes slideUpFadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .success-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            color: #0e3a5b;
            display: inline-block;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform: scale(0);
        }
        @keyframes popIn {
            to { transform: scale(1); }
        }
        .success-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0e3a5b;
            margin-bottom: 15px;
            line-height: 1.3;
        }
        .success-desc {
            font-size: 1.05rem;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.6;
            word-break: keep-all;
        }
        .home-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: #0e3a5b;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 8px 20px rgba(14, 58, 91, 0.2);
        }
        .home-btn:hover {
            background-color: #0a2a44;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="success-container">
        <!-- 럭셔리한 느낌을 주는 아이콘 -->
        <div class="success-icon">✨📦</div>
        <h1 class="success-title">주문이 성공적으로<br>완료되었습니다</h1>
        <p class="success-desc">
            가맹점주님의 소중한 발주가 접수되었습니다.<br>
            빠른 시일 내에 안전하게 배송해 드리겠습니다.<br>
            감사합니다.
        </p>
        <a href="/" class="home-btn">메인 화면으로 돌아가기</a>
    </div>
<script src="/static/globalWholesale.js?v=1.0"></script>
</body>
</html>
