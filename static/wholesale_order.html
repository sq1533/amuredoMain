<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도매 결제 - 아무래도 안경</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="/static/style.css?v=21.0">
    <!-- 다날 결제 SDK -->
    <script src="https://static.danalpay.com/d1/sdk/index.js"></script>
    <!-- 카카오(다음) 우편번호 서비스 API -->
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <style>
        /* 🏁 공통 카드 레이아웃 */
        .ws-card {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #eaeaea;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .order-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 30px;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #666;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .back-link:hover { color: #0e3a5b; background: #e2e6ea; }
        
        .order-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0e3a5b;
            margin-bottom: 30px;
        }
        
        /* 1행 요약 UI */
        .summary-dashboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
        }
        .summary-block { text-align: center; flex: 1; }
        .summary-label { font-size: 0.9rem; color: #666; margin-bottom: 10px; font-weight: 600; }
        .summary-value { font-size: 1.5rem; font-weight: 800; color: #333; }
        .summary-operator { font-size: 1.5rem; color: #ccc; font-weight: 300; }
        .final-value { color: #d32f2f; font-size: 1.8rem; }
        
        /* 결제 버튼 */
        .payment-btn {
            width: 100%;
            padding: 18px;
            background-color: #3182f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.25rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(49, 130, 246, 0.2);
            transition: background 0.3s;
        }
        .payment-btn:hover { background-color: #1b64da; }
        
        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f8f9fa;
        }

        /* 🏁 요청된 폼 그리드 레이아웃 */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-row.address-row {
            grid-template-columns: 1fr 3fr; /* 우편번호:주소 = 1:3 비율 */
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }
        .form-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: #666;
        }
        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus { border-color: #0e3a5b; }
        .form-input[readonly] { background-color: #f9f9f9; color: #888; }
        
        .address-search-btn {
            width: 100%;
            padding: 14px;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 5px 0 15px 0;
            transition: background 0.2s;
        }
        .address-search-btn:hover { background: #000; }
        
        #postcodeLayerCloseBtn {
            cursor: pointer;
            position: absolute;
            right: 10px;
            top: 10px;
            z-index: 10006;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .order-container { padding: 20px 15px; margin: 90px auto 40px auto; } /* 상단 플로팅 메뉴바(70px) 고려하여 90px로 수정 */
            .order-title { font-size: 1.5rem; margin-bottom: 20px; }
            .form-row { grid-template-columns: 1fr; gap: 0; }
            .summary-dashboard { flex-direction: column; gap: 10px; padding: 15px 20px; align-items: stretch; }
            .summary-operator { display: none; }
            .summary-block {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px 0;
                border-bottom: 1px dashed #eee;
            }
            .summary-block:last-child { border-bottom: none; padding-top: 15px; border-top: 1px solid #eee; }
            
            /* 텍스트 크기 축소 (줄바꿈 방지) */
            .summary-label { font-size: 0.85rem; margin-bottom: 0; }
            .summary-value { font-size: 1.1rem; }
            .final-value { font-size: 1.3rem; }
            
            .ws-card { padding: 20px; }
            .section-title { font-size: 1.1rem; margin-bottom: 20px; }
        }

        /* 🏁 다날 결제수단 그리드 UI 스타일 */
        .payment-methods-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 10px;
        }
        .pay-method-label {
            cursor: pointer;
            user-select: none;
        }
        .pay-method-label input[type="radio"] {
            display: none;
        }
        .pay-method-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 15px;
            background: transparent;
            border: none;
            border-radius: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pay-method-label input[type="radio"]:checked + .pay-method-card {
            background: #f2f7ff;
        }
        .pay-method-icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        .pay-method-name {
            font-size: 1.15rem;
            font-weight: 800;
            color: #333;
        }
        .pay-method-label input[type="radio"]:checked + .pay-method-card .pay-method-name {
            color: #1b64da;
        }
        .pay-method-icon-svg {
            transition: color 0.25s ease;
        }
        .pay-method-label input[type="radio"]:checked + .pay-method-card .pay-method-icon-svg {
            color: #1b64da !important;
        }
        .pay-method-card:hover .pay-method-icon-svg {
            color: #0e3a5b;
        }
        @media (max-width: 768px) {
            .payment-methods-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .pay-method-card {
                padding: 15px 10px;
            }
            .pay-method-icon {
                font-size: 1.5rem;
            }
            .pay-method-name {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="order-container">
        <a href="#" class="back-link" onclick="history.back(); return false;">← 장바구니로 돌아가기</a>
        <h1 class="order-title">결제 진행</h1>
        
        <!-- 1행 요약 대시보드 -->
        <div class="summary-dashboard ws-card">
            <div class="summary-block">
                <div class="summary-label">총 상품 금액</div>
                <div class="summary-value" id="totalAmount">₩ 0</div>
            </div>
            <div class="summary-operator">-</div>
            <div class="summary-block">
                <div class="summary-label">할인 혜택</div>
                <div class="summary-value">₩ 0</div>
            </div>
            <div class="summary-operator">=</div>
            <div class="summary-block">
                <div class="summary-label">최종 결제 금액</div>
                <div class="summary-value final-value" id="finalAmount">₩ 0</div>
            </div>
        </div>

        <!-- 🏁 수정된 배송지 정보 UI -->
        <div class="shipping-section ws-card">
            <h2 class="section-title">📦 배송지 정보</h2>
            
            <!-- 1행: 수령인 + 연락처 -->
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">수령인</label>
                    <input type="text" id="recipientName" class="form-input" placeholder="이름">
                </div>
                <div class="form-group">
                    <label class="form-label">연락처</label>
                    <input type="text" id="recipientPhone" class="form-input" placeholder="010-0000-0000">
                </div>
            </div>

            <!-- 2행: 우편번호 + 주소 (1:3 비율 적용) -->
            <div class="form-row address-row">
                <div class="form-group">
                    <label class="form-label">우편번호</label>
                    <input type="text" id="postcode" class="form-input" placeholder="우편번호" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label">주소</label>
                    <input type="text" id="address" class="form-input" placeholder="기본 주소" readonly>
                </div>
            </div>

            <!-- 3행: 주소찾기 버튼 -->
            <button class="address-search-btn" onclick="openDaumPostcode()">주소 찾기</button>

            <!-- 4행: 상세 주소 -->
            <div class="form-group">
                <label class="form-label">상세 주소</label>
                <input type="text" id="detailAddress" class="form-input" placeholder="상세 주소를 입력하세요">
            </div>
        </div>

        <!-- 다날 결제 수단 선택 영역 -->
        <div class="ws-card">
            <h2 class="section-title">💳 결제 수단</h2>
            <div class="payment-methods-grid">
                <label class="pay-method-label" for="method-card">
                    <input type="radio" id="method-card" name="danal-payment-method" value="CARD">
                    <div class="pay-method-card" style="min-height: 92px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #333; margin-bottom: 8px;" class="pay-method-icon-svg">
                            <rect x="2" y="5" width="20" height="14" rx="2" ry="2"></rect>
                            <line x1="2" y1="10" x2="22" y2="10"></line>
                        </svg>
                        <span class="pay-method-name">신용카드</span>
                    </div>
                </label>
                <label class="pay-method-label" for="method-vaccount">
                    <input type="radio" id="method-vaccount" name="danal-payment-method" value="VACCOUNT">
                    <div class="pay-method-card" style="min-height: 92px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #333; margin-bottom: 8px;" class="pay-method-icon-svg">
                            <path d="M3 21h18"></path>
                            <path d="M3 10h18"></path>
                            <path d="M5 6l7-3 7 3"></path>
                            <path d="M4 10v11"></path>
                            <path d="M20 10v11"></path>
                            <path d="M8 14v3"></path>
                            <path d="M12 14v3"></path>
                            <path d="M16 14v3"></path>
                        </svg>
                        <span class="pay-method-name">가상계좌</span>
                    </div>
                </label>
                <label class="pay-method-label" for="method-kakaopay">
                    <input type="radio" id="method-kakaopay" name="danal-payment-method" value="KAKAOPAY">
                    <div class="pay-method-card" style="min-height: 92px; padding: 0; border: none; background: transparent; box-shadow: none; display: flex; align-items: center; justify-content: center;">
                        <img src="/static/img/kakaopay.webp" alt="카카오페이" style="width: 80px; height: auto; object-fit: contain;">
                    </div>
                </label>
                <label class="pay-method-label" for="method-tosspay">
                    <input type="radio" id="method-tosspay" name="danal-payment-method" value="TOSSPAY">
                    <div class="pay-method-card" style="min-height: 92px; padding: 0; border: none; background: transparent; box-shadow: none; display: flex; align-items: center; justify-content: center;">
                        <img src="/static/img/tosspay.webp" alt="토스페이" style="width: 100%; height: 92px; object-fit: contain;">
                    </div>
                </label>
            </div>
        </div>

        <button class="payment-btn" id="payment-request-button" style="display: none;">결제하기</button>
    </div>

    <!-- 결제 취소/실패 모달 -->
    <div id="paymentCancelModal" class="ws-modal-overlay">
        <div class="ws-modal-content">
            <div style="font-size: 3rem; margin-bottom: 20px;">⚠️</div>
            <div style="font-size: 1.4rem; font-weight: 800; color: #d32f2f; margin-bottom: 10px;">주문 취소</div>
            <div id="cancelMessage" style="font-size: 1rem; color: #666; margin-bottom: 30px; line-height: 1.6;">결제가 중단되었거나<br>주문이 정상적으로 취소되었습니다.</div>
            <button onclick="closeCancelModal()" class="ws-btn-primary">확인</button>
        </div>
    </div>

    <div id="postcodeLayerWrapper" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10005; backdrop-filter: blur(5px); justify-content: center; align-items: center;">
        <div id="postcodeLayer" style="position: relative; background: #fff; overflow: hidden;">
            <button id="postcodeLayerCloseBtn" onclick="closeDaumPostcode()">✕</button>
        </div>
    </div>

    <script>
        const layerWrapper = document.getElementById('postcodeLayerWrapper');
        const layer = document.getElementById('postcodeLayer');

        function closeDaumPostcode() {
            layerWrapper.style.display = 'none';
        }

        function showCancelModal(msg) {
            if(msg) document.getElementById("cancelMessage").innerHTML = msg;
            document.getElementById("paymentCancelModal").style.display = "flex";
        }
        function closeCancelModal() {
            document.getElementById("paymentCancelModal").style.display = "none";
            const url = new URL(window.location.href);
            url.searchParams.delete('status');
            url.searchParams.delete('message');
            window.history.replaceState({}, '', url);
        }

        function openDaumPostcode() {
            // 1. 먼저 레이어를 화면에 노출 (Flex)
            layerWrapper.style.display = 'flex';
            
            // 2. 현재 화면 크기에 맞게 컨테이너 크기 조절
            updateLayerPosition();

            // 3. 노출된 컨테이너 안에 주소 검색창 임베딩 (순서 중요)
            new daum.Postcode({
                oncomplete: function(data) {
                    let addr = data.userSelectedType === 'R' ? data.roadAddress : data.jibunAddress;
                    document.getElementById('postcode').value = data.zonecode;
                    document.getElementById("address").value = addr;
                    document.getElementById("detailAddress").focus();
                    closeDaumPostcode();
                },
                width : '100%', height : '100%'
            }).embed(layer);
        }

        function updateLayerPosition(){
            const isMobile = window.innerWidth <= 768;
            const width = isMobile ? window.innerWidth : 600;
            const height = isMobile ? 450 : 480; // 모바일에서는 높이를 약간 줄여 안정감 확보

            layer.style.width = width + 'px';
            layer.style.height = height + 'px';
            layer.style.borderRadius = isMobile ? '0' : '12px';
            layer.style.boxShadow = '0 10px 40px rgba(0,0,0,0.3)';
        }
        window.addEventListener('resize', updateLayerPosition);

        document.addEventListener("DOMContentLoaded", async () => {
            const payBtn = document.getElementById("payment-request-button");
            payBtn.disabled = false;
            payBtn.textContent = "결제하기";

            // 🏁 1. 결제 설정 로드 (다날)
            let clientKey = "";
            let merchantId = "";
            try {
                const configRes = await fetch("/api/payment/config");
                const configData = await configRes.json();
                clientKey = configData.client_key;
                merchantId = configData.merchant_id;
                
                if (!clientKey || !merchantId) throw new Error("Danal Key is missing");
            } catch (e) {
                console.error("결제 설정 로드 에러:", e);
                alert("결제 시스템 설정을 불러오지 못했습니다. 관리자에게 문의해주세요.");
                payBtn.textContent = "결제 시스템 오류";
                return;
            }

            // 🏁 2. 장바구니 데이터 파싱 및 금액 계산
            const getCookie = (name) => {
                const value = `; ${document.cookie}`;
                const parts = value.split(`; ${name}=`);
                if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
            };

            const cartData = getCookie("wholesale_cart");
            if (!cartData) { location.href = "/wholesale/cart"; return; }

            const cart = JSON.parse(cartData);
            let amount = 0;
            
            cart.forEach(item => { 
                let price = 0;
                if (typeof item.unit_price === 'string') {
                    price = parseInt(item.unit_price.replace(/[^0-9]/g, "")) || 0;
                } else {
                    price = parseInt(item.unit_price) || 0;
                }
                let qty = 0;
                if (typeof item.quantity === 'string') {
                    qty = parseInt(item.quantity.replace(/[^0-9]/g, "")) || 0;
                } else {
                    qty = parseInt(item.quantity) || 0;
                }
                amount += price * qty;
            });

            if (isNaN(amount) || amount <= 0) {
                alert("결제 금액을 계산하는 중 오류가 발생했습니다.");
                return;
            }

            document.getElementById("totalAmount").textContent = formatWon(amount);
            document.getElementById("finalAmount").textContent = formatWon(amount);

            // 🏁 3. 사용자 정보 연동
            try {
                const userRes = await fetch("/api/user/me");
                const userData = await userRes.json();
                if (userData.status === "success" && userData.user && userData.user.name) {
                    document.getElementById("recipientName").value = userData.user.name;
                }
            } catch(e) { console.log("사용자 정보 로드 실패"); }

            const orderId = "ORDER_" + new Date().getTime();
            const orderName = cart.length === 1 ? cart[0].name : `${cart[0].name} 외 ${cart.length - 1}건`;

            async function requestCheckout(selectedMethod) {
                const rName = document.getElementById("recipientName").value;
                const rPhone = document.getElementById("recipientPhone").value;
                const pCode = document.getElementById("postcode").value;
                const address = document.getElementById("address").value;
                const detailAddress = document.getElementById("detailAddress").value;

                if (!rName || !rPhone || !pCode || !address) { alert("배송지 정보를 모두 입력해주세요."); return; }

                try {
                    const pendingRes = await fetch("/api/payment/pending_order", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ 
                            orderId, amount, orderName, cart: cart, 
                            customerName: rName, customerPhone: rPhone, 
                            postcode: pCode, address, detailAddress 
                        })
                    });
                    const pendingData = await pendingRes.json();
                    if(pendingData.status !== "success") throw new Error(pendingData.message);
                } catch (err) { 
                    alert("주문 처리 중 오류가 발생했습니다: " + err.message); 
                    return; 
                }

                // 간편결제(카카오페이 / 토스페이) 분기 처리
                if (selectedMethod === "KAKAOPAY" || selectedMethod === "TOSSPAY") {
                    try {
                        const readyUrl = selectedMethod === "KAKAOPAY" ? "/api/payment/kakaopay_ready" : "/api/payment/tosspay_ready";
                        const payRes = await fetch(readyUrl, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                orderId: orderId,
                                amount: amount,
                                orderName: orderName
                            })
                        });
                        const payData = await payRes.json();
                        if (payData.status === "success" && payData.redirectUrl) {
                            window.location.href = payData.redirectUrl;
                        } else {
                            throw new Error(payData.message || "결제 준비 실패");
                        }
                    } catch (error) {
                        alert("간편결제 준비 중 오류가 발생했습니다: " + error.message);
                    }
                    return;
                }

                // 다날 SDK 호출
                try {
                    const danalPayments = DanalPayments(clientKey);
                    
                    // 사용자 이메일 획득
                    let customerEmail = "guest@amuredo.com";
                    try {
                        const userRes = await fetch("/api/user/me");
                        const userData = await userRes.json();
                        if (userData.status === "success" && userData.user && userData.user.email) {
                            customerEmail = userData.user.email;
                        } else if (userData.status === "success" && userData.user && userData.user.id) {
                            customerEmail = userData.user.id;
                        }
                    } catch(e) {}

                    const paymentParams = {
                        orderName: orderName,
                        amount: amount,
                        merchantId: merchantId,
                        orderId: orderId,
                        userId: customerEmail,
                        successUrl: window.location.origin + "/api/payment/wholesale_success", 
                        failUrl: window.location.origin + "/api/payment/danal_fail",
                        userEmail: customerEmail,
                        userName: rName,
                        paymentsMethod: selectedMethod
                    };

                    if (selectedMethod === "VACCOUNT") {
                        paymentParams.notiUrl = window.location.origin + "/api/payment/danal_noti";
                        if (configData && configData.expire_date && configData.expire_time) {
                            paymentParams.expireDate = configData.expire_date;
                            paymentParams.expireTime = configData.expire_time;
                        }
                    }

                    await danalPayments.requestPayment(paymentParams);
                } catch (error) {
                    showCancelModal("오류: " + error.message);
                }
            }

            // 각 결제수단 라벨 클릭 이벤트 바인딩
            document.querySelectorAll(".pay-method-label").forEach(label => {
                label.addEventListener("click", async (e) => {
                    e.preventDefault(); // 기본 체크 동작 억제 후 커스텀 처리
                    
                    const radio = label.querySelector("input[name='danal-payment-method']");
                    if (radio) {
                        radio.checked = true;
                        await requestCheckout(radio.value);
                    }
                });
            });

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('status') === 'fail') showCancelModal(urlParams.get('message') || "결제에 실패했습니다.");
        });
    </script>
<script src="/static/globalWholesale.js?v=3.4"></script>
</body>
</html>
