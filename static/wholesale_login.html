<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도매 로그인 - 아무래도 안경</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="/static/style.css?v=14.32">
    <style>
        .login-container {
            max-width: 400px;
            margin: 150px auto;
            padding: 40px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .login-title {
            font-size: 2rem;
            font-weight: 700;
            color: #0e3a5b;
            margin-bottom: 10px;
            text-align: center;
        }
        .login-subtitle {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 40px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #0e3a5b;
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: #0e3a5b;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }
        .submit-btn:hover {
            background: #0a2a44;
        }
        .register-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .register-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1 class="login-title">Antioch Login</h1>
        <p class="login-subtitle">도매 파트너 전용 로그인 페이지입니다.</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
            </div>
            <button type="submit" id="submitBtn" class="submit-btn">로그인</button>
        </form>
        <a href="/wholesale/register" class="register-link">아직 회원이 아니신가요? 가입 신청하기</a>
    </div>

    <!-- 🏁 커스텀 팝업 (모달) UI -->
    <div id="customModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(3px);">
        <div style="background: white; padding: 40px 30px; border-radius: 16px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); width: 320px; text-align: center; transform: translateY(-20px); animation: modalFadeIn 0.3s forwards;">
            <div id="modalIcon" style="font-size: 2.5rem; margin-bottom: 15px;">👋</div>
            <div id="modalTitle" style="font-size: 1.3rem; font-weight: 800; color: #0e3a5b; margin-bottom: 10px;">알림</div>
            <div id="modalMessage" style="font-size: 0.95rem; color: #666; margin-bottom: 30px; line-height: 1.5; word-break: keep-all;">메시지 내용</div>
            <button id="modalConfirmBtn" style="width: 100%; padding: 14px; background: #0e3a5b; color: white; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: bold; cursor: pointer; transition: background 0.3s;">확인</button>
        </div>
    </div>
    <style>
        @keyframes modalFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <script>
        // 팝업 컨트롤 함수
        function showModal(type, title, message, callback) {
            const modal = document.getElementById('customModal');
            const icon = document.getElementById('modalIcon');
            const titleEl = document.getElementById('modalTitle');
            const messageEl = document.getElementById('modalMessage');
            const confirmBtn = document.getElementById('modalConfirmBtn');

            if (type === 'success') {
                icon.textContent = '🎉';
                titleEl.style.color = '#0e3a5b';
                confirmBtn.style.background = '#0e3a5b';
            } else {
                icon.textContent = '🚨';
                titleEl.style.color = '#d32f2f';
                confirmBtn.style.background = '#d32f2f';
            }

            titleEl.textContent = title;
            messageEl.innerHTML = message;
            modal.style.display = 'flex';

            const newBtn = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newBtn, confirmBtn);

            newBtn.addEventListener('click', () => {
                modal.style.display = 'none';
                if (callback) callback();
            });
        }
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById("submitBtn");
            submitBtn.disabled = true;
            submitBtn.innerText = "로그인 중...";

            const formData = new FormData(e.target);

            try {
                const response = await fetch("/api/user/login", {
                    method: "POST",
                    body: formData
                });
                const result = await response.json();

                if (result.status === "success") {
                    showModal('success', '로그인 성공', result.message, () => {
                        location.href = "/antioch"; // 도매 전용 페이지로 이동
                    });
                } else {
                    showModal('error', '로그인 실패', result.message);
                }
            } catch (error) {
                showModal('error', '시스템 오류', '서버 통신 중 오류가 발생했습니다.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "로그인";
            }
        });
    </script>
<script src="/static/globalWholesale.js?v=1.0"></script>
</body>
</html>
