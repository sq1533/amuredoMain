<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>아무래도 안경</title>
    <meta name="description" content="분위기와 억양을 디자인을 디자인합니다. 아무래도 안경, 본질의 아름다움을 추구합니다">
    <!-- 아무레도 검색엔진 최적화(SEO) 및 SNS 공유 설정 -->
    <meta property="og:title" content="아무래도 안경 공식 홈페이지">
    <meta property="og:description" content="분위기와 억양을 디자인을 디자인합니다. 아무래도 안경, 본질의 아름다움을 추구합니다">
    <meta property="og:image" content="/static/img/meta.webp">
    <meta property="og:type" content="website">
    <!-- 아무레도 브랜드 파비콘(Favicon) 설정 -->
    <link rel="icon" href="/static/img/icon.webp" type="image/webp">
    <link rel="apple-touch-icon" href="/static/img/icon.webp">
    <!-- 구글 폰트 'Dongle' 전용 (웹사이트 메인 폰트) -->
    <link href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- 외부 공통 스타일시트 연결 -->
    <link rel="stylesheet" href="/static/style.css?v=9.4">
</head>
<body>
    <div class="app-container">
        
        <!-- 최상단 헤더(Header) 영역: 모든 페이지 공통 레이아웃 -->
        <header class="main-header">
            <div class="logo-wrapper">
                <img src="/static/img/logo.webp" alt="amuredo Logo" class="logo" style="cursor: pointer;" onclick="location.href='/'">
            </div>
            <button class="menu-toggle-btn" id="menuToggleBtn" aria-label="메뉴 열기">
                <span class="hamburger-box"></span>
            </button>
            <nav class="page-nav" id="pageNav">
                <button class="close-menu-btn" id="closeMenuBtn" aria-label="메뉴 닫기">✕</button>
                <ul class="nav-links">
                    <li><button class="nav-switch-btn" onclick="location.href='/sunglasses'">Sunglasses</button></li>
                    <li><button class="nav-switch-btn" onclick="location.href='/glasses'">Glasses</button></li>
                    <li><button class="nav-switch-btn" onclick="location.href='/goggles'">Goggles</button></li>
                    <li><button class="nav-switch-btn" onclick="location.href='/about'">about</button></li>
                    <li><button class="nav-switch-btn" onclick="location.href='/contact'">문의하기</button></li>
                </ul>
            </nav>
            <div class="nav-overlay" id="navOverlay"></div>
        </header>

        <!-- 문의하기 메인 컨텐츠 영역 -->
        <main class="contact-main fade-in-section">
            <div class="contact-container">
                <h1 class="contact-title">Contact Us</h1>
                <p class="contact-subtitle">궁금하신 점이 있다면 언제든 문의해 주세요. 최대한 빠르게 답변 드리겠습니다.</p>
                
                <form id="contactForm" class="contact-form" enctype="multipart/form-data">
                    <!-- 1. 이메일 입력란 -->
                    <div class="form-group">
                        <label for="email">답변 받으실 이메일</label>
                        <input type="email" id="email" name="email" placeholder="example@email.com" required>
                    </div>

                    <!-- 2. 문의사항 입력란 -->
                    <div class="form-group">
                        <label for="message">문의 내용</label>
                        <textarea id="message" name="message" rows="8" placeholder="문의하실 내용을 입력해주세요. (허용되지 않은 특수문자는 자동 필터링될 수 있습니다.)" required></textarea>
                    </div>

                    <!-- 3. 사진 첨부란 (최대 5개) -->
                    <div class="form-group">
                        <label>사진 첨부 (최대 5장, 장당 2MB 이내)</label>
                        <div class="file-upload-wrapper">
                            <!-- 실제 input은 숨기고 커스텀 label로 트리거 -->
                            <input type="file" id="images" name="images" accept=".jpg, .jpeg, .png, .webp" multiple style="display: none;">
                            <label for="images" class="custom-file-label">첨부하기</label>
                            
                            <div class="file-preview-container" id="filePreview"></div>
                            <p class="file-help-text">* 허용 확장자: jpg, jpeg, png, webp</p>
                        </div>
                    </div>

                    <!-- 4. 이메일 수집 동의 체크박스 -->
                    <div class="form-group consent-group">
                        <label class="checkbox-container">
                            <input type="checkbox" id="consent" name="consent">
                            <span class="checkmark"></span>
                            이메일 수집 및 이용에 동의합니다. (필수)
                        </label>
                    </div>

                    <!-- 5. 전송 버튼 -->
                    <div class="form-submit-wrapper">
                        <button type="submit" id="submitBtn" class="submit-btn" disabled>전송하기</button>
                    </div>
                </form>
            </div>
        </main>

        <!-- 공통 푸터(Footer): 사업자 정보 -->
        <footer class="main-footer">
            <hr class="footer-divider">
            <div class="footer-info">
                <p>상호명 및 호스트 서비스 제공 : 주식회사 키제이</p>
                <p>대표 : 서명원 / 연락처 : 010-7247-6006</p>
                <p>email : amuredo_shop@naver.com</p>
                <p>서울시 관악구 난곡로 128, 1층</p>
                <p>사업자 등록 번호 : 257-87-03297</p>
                <p>통신판매업 신고 : 2026-서울관악-0029</p>
            </div>
        </footer>
    </div>

    <!-- 문의하기 전용 스크립트 연결 -->
    <script src="/static/contact.js?v=1.0"></script>
    <script>
        // 헤더 공통 로직 (기본 탑재)
        document.addEventListener("DOMContentLoaded", () => {
            const menuBtn = document.getElementById("menuToggleBtn");
            const closeBtn = document.getElementById("closeMenuBtn");
            const pageNav = document.getElementById("pageNav");
            const navOverlay = document.getElementById("navOverlay");

            function toggleMenu() {
                pageNav.classList.toggle("open");
                navOverlay.classList.toggle("active");
            }
            if(menuBtn) menuBtn.addEventListener("click", toggleMenu);
            if(closeBtn) closeBtn.addEventListener("click", toggleMenu);
            if(navOverlay) navOverlay.addEventListener("click", toggleMenu);

            const fadeEl = document.querySelector(".fade-in-section");
            setTimeout(() => { fadeEl.classList.add("is-visible"); }, 100);
        });
    </script>
</body>
</html>
