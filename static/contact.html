<body>

    <!-- 최상단 헤더(Header) 영역: 모든 페이지 공통 레이아웃 -->
    <header class="main-header">
        <!-- PC 좌측 메뉴 -->
        <nav class="pc-nav-left">
            <button class="nav-switch-btn" onclick="location.href='/about'">About</button>
            <button class="nav-switch-btn" onclick="location.href='/contact'">Connect</button>
        </nav>

        <!-- 모바일 전용 햄버거 메뉴 버튼 -->
        <button class="menu-toggle-btn" id="menuToggleBtn" aria-label="메뉴 열기">
            <span class="hamburger-box"></span>
        </button>

        <!-- 중앙 로고 -->
        <div class="logo-wrapper">
            <img src="/static/img/logo.png" alt="amuredo Logo" class="logo" style="cursor: pointer;"
                onclick="location.href='/'">
        </div>

        <!-- PC 우측 메뉴 -->
        <nav class="pc-nav-right">
            <button class="nav-switch-btn" onclick="location.href='/glasses'">Glasses</button>
            <button class="nav-switch-btn" onclick="location.href='/sunglasses'">Sunwear</button>
        </nav>

        <!-- 모바일 네비게이션 드로어 -->
        <nav class="page-nav" id="pageNav">
            <button class="close-menu-btn" id="closeMenuBtn" aria-label="메뉴 닫기">✕</button>
            <ul class="nav-links">
                <li><button class="nav-switch-btn" onclick="location.href='/glasses'">Glasses</button></li>
                <li><button class="nav-switch-btn" onclick="location.href='/sunglasses'">Sunwear</button></li>
                <li><button class="nav-switch-btn" onclick="location.href='/about'">About</button></li>
                <li><button class="nav-switch-btn" onclick="location.href='/contact'">Connect</button></li>
            </ul>
        </nav>

        <div class="nav-overlay" id="navOverlay"></div>
    </header>

    <div class="app-container">
        <!-- 메인 콘텐츠 영역 (문의하기 페이지) -->
        <main class="main-content contact-main sub-page-main">
            <div class="contact-container">
                <h1 class="contact-title">Connect</h1>
                <p class="contact-subtitle">아무래도에 대한 문의사항이나 협업 제안을 남겨주세요.</p>

                <form id="contactForm" class="contact-form">
                    <div class="form-group">
                        <label for="email">이메일 주소</label>
                        <input type="email" id="email" name="email" placeholder="example@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="message">문의 내용</label>
                        <textarea id="message" name="message" rows="8" placeholder="내용을 입력해주세요." required></textarea>
                    </div>

                    <!-- 이미지 첨부 영역 (다중 선택 가능) -->
                    <div class="form-group">
                        <label>이미지 첨부 (최대 5장)</label>
                        <div class="file-upload-wrapper">
                            <label for="images" class="custom-file-label">파일 선택</label>
                            <input type="file" id="images" name="images" accept="image/*" multiple>
                            <p class="file-help-text">JPG, PNG, WebP 형식의 이미지를 선택할 수 있습니다.</p>
                            <div id="imagePreview" class="file-preview-container"></div>
                        </div>
                    </div>

                    <!-- 개인정보 수집 동의 -->
                    <div class="consent-group">
                        <label class="checkbox-container">
                            개인정보 수집 및 이용에 동의합니다.
                            <input type="checkbox" id="consent" required>
                            <span class="checkmark"></span>
                        </label>
                    </div>

                    <div class="form-submit-wrapper">
                        <button type="submit" id="submitBtn" class="submit-btn" disabled>보내기</button>
                    </div>
                </form>
            </div>
        </main>

        <!-- 공통 푸터(Footer): 사업자 정보 -->
        <footer class="main-footer">
            <hr class="footer-divider">
            <div class="footer-info">
                <p>상호명 및 호스트 서비스 제공 : 주식회사 키제이</p>
                <p>대표 : 서명원 / 연락처 : 010-7247-6006</p>
                <p>email : amuredo_shop@naver.com</p>
                <p>서울시 관악구 난곡로 128, 1층</p>
                <p>사업자 등록 번호 : 257-87-03297</p>
                <p>통신판매업 신고 : 2026-서울관악-0029</p>
            </div>
        </footer>
    </div>

    <!-- Contact 페이지 로직 스크립트 (Firebase 연동 등) -->
    <script src="/static/contact.js?v=2.1"></script>

    <!-- 공통 메뉴 동작용 스크립트 -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const menuToggleBtn = document.getElementById("menuToggleBtn");
            const closeMenuBtn = document.getElementById("closeMenuBtn");
            const pageNav = document.getElementById("pageNav");
            const navOverlay = document.getElementById("navOverlay");

            function toggleMenu() {
                pageNav.classList.toggle("open");
                navOverlay.classList.toggle("active");
            }

            if (menuToggleBtn) menuToggleBtn.addEventListener("click", toggleMenu);
            if (closeMenuBtn) closeMenuBtn.addEventListener("click", toggleMenu);
            if (navOverlay) navOverlay.addEventListener("click", toggleMenu);
        });
    </script>
