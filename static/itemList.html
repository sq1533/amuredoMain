<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 아무레도 검색엔진 최적화(SEO) 및 SNS 공유 설정 -->
    <title>아무래도 안경</title>
    <meta name="description" content="분위기와 억양을 디자인을 디자인합니다. 아무래도 안경, 본질의 아름다움을 추구합니다">
    <meta property="og:title" content="아무래도 안경 공식 홈페이지">
    <meta property="og:description" content="분위기와 억양을 디자인을 디자인합니다. 아무래도 안경, 본질의 아름다움을 추구합니다">
    <meta property="og:image" content="/static/img/meta.webp">
    <meta property="og:type" content="website">

    <!-- 아무레도 브랜드 파비콘(Favicon) 설정 -->
    <link rel="icon" href="/static/img/icon.webp" type="image/webp">
    <link rel="apple-touch-icon" href="/static/img/icon.webp">
    <!-- 구글 폰트 'Dongle' 전용 (웹사이트 메인 폰트) -->
    <link href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- 외부 공통 스타일시트 연결 (캐시 무효화) -->
    <link rel="stylesheet" href="/static/style.css?v=9.4">
</head>
<body>
    <div class="app-container">
        
        <!-- 최상단 헤더(Header) 영역: 사이트 전역 공통 사용 -->
        <header class="main-header">
            <div class="logo-wrapper">
                <img src="/static/img/logo.webp" alt="amuredo Logo" class="logo" style="cursor: pointer;" onclick="location.href='/'">
            </div>
            
            <button class="menu-toggle-btn" id="menuToggleBtn" aria-label="메뉴 열기">
                <span class="hamburger-box"></span>
            </button>

            <nav class="page-nav" id="pageNav">
                <button class="close-menu-btn" id="closeMenuBtn" aria-label="메뉴 닫기">✕</button>
                <ul class="nav-links">
                    <li><button class="nav-switch-btn" onclick="location.href='/sunglasses'">Sunglasses</button></li>
                    <li><button class="nav-switch-btn" onclick="location.href='/glasses'">Glasses</button></li>
                    <li><button class="nav-switch-btn" onclick="location.href='/goggles'">Goggles</button></li>
                    <li><button class="nav-switch-btn" onclick="location.href='/about'">about</button></li>
                    <li><button class="nav-switch-btn" onclick="location.href='/contact'">문의하기</button></li>
                </ul>
            </nav>
            <div class="nav-overlay" id="navOverlay"></div>
        </header>

        <!-- 메인 콘텐츠 영역 (카테고리별 Item List 구현 구역) -->
        <main class="main-content" style="padding-top: 3rem; padding-bottom: 5rem;">
            <!-- 현재 페이지의 카테고리 타이틀 (JS가 자동으로 경로를 읽어와 주입) -->
            <h1 class="category-page-title" id="categoryTitle">Category</h1>
            
            <!-- 딱 붙어있는 1:1 사진 전용 카테고리 3열 그리드 컨테이너 -->
            <div class="category-grid-container" id="categoryGrid">
                <!-- JS 코드가 /api/items?category={sort} 호출 뒤 1:1 사진 DOM만 생성하여 결합합니다 -->
            </div>
        </main>

        <!-- 공통 푸터(Footer): 사업자 정보 -->
        <footer class="main-footer">
            <hr class="footer-divider">
            <div class="footer-info">
                <p>상호명 및 호스트 서비스 제공 : 주식회사 키제이</p>
                <p>대표 : 서명원 / 연락처 : 010-7247-6006</p>
                <p>email : amuredo_shop@naver.com</p>
                <p>서울시 관악구 난곡로 128, 1층</p>
                <p>사업자 등록 번호 : 257-87-03297</p>
                <p>통신판매업 신고 : 2026-서울관악-0029</p>
            </div>
        </footer>
    </div>

    <!-- itemList용 라우팅 및 렌더링을 처리하는 자바스크립트 연결 (캐시 갱신) -->
    <script src="/static/itemList.js?v=4.5"></script>
    
    <!-- 공통 메뉴 동작용 스크립트: main.js의 역할을 카테고리 페이지에서도 사용할 수 있도록 탑재 -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const menuToggleBtn = document.getElementById("menuToggleBtn");
            const closeMenuBtn = document.getElementById("closeMenuBtn");
            const pageNav = document.getElementById("pageNav");
            const navOverlay = document.getElementById("navOverlay");

            function toggleMenu() {
                pageNav.classList.toggle("open");
                navOverlay.classList.toggle("active");
            }

            if(menuToggleBtn) menuToggleBtn.addEventListener("click", toggleMenu);
            if(closeMenuBtn) closeMenuBtn.addEventListener("click", toggleMenu);
            if(navOverlay) navOverlay.addEventListener("click", toggleMenu);
        });
    </script>
</body>
</html>
