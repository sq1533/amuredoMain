<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 아무레도 검색엔진 최적화(SEO) 및 SNS 공유 설정 -->
    <title>예약 확인 - 아무래도 안경</title>
    <meta name="description" content="분위기와 억양을 디자인을 디자인합니다. 아무래도 안경, 본질의 아름다움을 추구합니다">
    <link rel="icon" href="/static/img/icon.webp" type="image/webp">
    <link rel="apple-touch-icon" href="/static/img/icon.webp">
    
    <!-- 전역 메인 폰트 Pretendard 연결 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="/static/style.css?v=71.0">
    <style>
        .bookings-wrapper {
            max-width: 900px;
            margin: 110px auto 60px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .bookings-title {
            font-size: var(--fs-t);
            font-weight: 800;
            color: #0e3a5b;
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: -0.5px;
        }
        .bookings-subtitle {
            font-size: var(--fs-m);
            color: #666;
            text-align: center;
            margin-bottom: 45px;
            letter-spacing: -0.2px;
        }
        
        /* 로딩 스피너 및 빈 상태(Empty State) 스타일 */
        .loading-state, .empty-state {
            background: #fff;
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(14, 58, 91, 0.03);
            border: 1px solid #eaeaea;
            box-sizing: border-box;
        }
        .empty-icon {
            font-size: 3rem;
            color: #ccc;
            margin-bottom: 20px;
        }
        .empty-text {
            font-size: var(--fs-m);
            font-weight: 700;
            color: #555;
            margin-bottom: 25px;
        }
        .btn-go-shop {
            display: inline-block;
            padding: 15px 30px;
            background: #0e3a5b;
            color: #fff;
            font-weight: 800;
            font-size: var(--fs-m);
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .btn-go-shop:hover {
            background: #0b2d47;
            transform: translateY(-1px);
        }

        /* 🏁 익스펜더(아코디언) 카드 스타일 */
        .expander-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .expander-card {
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(14, 58, 91, 0.02);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .expander-card:hover {
            box-shadow: 0 12px 35px rgba(14, 58, 91, 0.05);
            border-color: #0e3a5b;
        }
        
        /* 취소되거나 완료된 예약은 흐리게 시인성 제한 */
        .expander-card.cancelled, .expander-card.completed, .expander-card.cancel-req, .expander-card.exchange-req, .expander-card.refund-completed {
            opacity: 0.75;
        }
        .expander-card.cancelled:hover, .expander-card.completed:hover, .expander-card.cancel-req:hover, .expander-card.exchange-req:hover, .expander-card.refund-completed:hover {
            box-shadow: none;
            border-color: #eaeaea;
        }

        /* 아코디언 헤더 */
        .expander-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 30px;
            cursor: pointer;
            user-select: none;
            background: #fff;
            transition: background 0.25s ease;
        }
        .expander-header:hover {
            background: #fafafa;
        }
        .expander-header-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }
        .expander-store {
            font-size: var(--fs-st);
            font-weight: 800;
            color: #0e3a5b;
            letter-spacing: -0.3px;
        }
        .expander-summary {
            font-size: var(--fs-sm);
            font-weight: 700;
            color: #666;
        }
        
        /* 화살표 아이콘 */
        .chevron-icon {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #0e3a5b;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .expander-card.open .chevron-icon {
            transform: rotate(180deg);
        }

        /* 아코디언 내용 영역 (CSS max-height Transition 적용) */
        .expander-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background: #fdfdfd;
            border-top: 0 solid #eee;
        }
        .expander-card.open .expander-content {
            border-top-width: 1px;
            /* 자바스크립트에서 실제 높이를 동적으로 주입하여 스무스하게 전개 */
        }
        .expander-content-inner {
            padding: 30px;
            box-sizing: border-box;
            text-align: left;
        }

        .section-sub {
            font-size: var(--fs-m);
            font-weight: 800;
            color: #0e3a5b;
            margin-bottom: 15px;
            letter-spacing: -0.2px;
            border-left: 3px solid #0e3a5b;
            padding-left: 8px;
        }

        /* 날짜 및 정보 박스 */
        .info-panel {
            background: #fafafa;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 25px;
            font-size: var(--fs-sm);
            color: #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .info-date-val {
            font-weight: 800;
            color: #333;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: var(--fs-s);
            font-weight: 800;
            background: #eef7fe;
            color: #0e3a5b;
        }
        .status-badge.cancelled-badge {
            background: #ffebeb;
            color: #d9534f;
        }
        .status-badge.completed-badge {
            background: #e6f9ec;
            color: #28a745;
        }
        .status-badge.paid-badge {
            background: #eef7fe;
            color: #0e3a5b;
        }
        .status-badge.cancel-req-badge {
            background: #fff0e6;
            color: #ff6600;
        }
        .status-badge.exchange-req-badge {
            background: #f0f0ff;
            color: #5f5ce5;
        }
        .status-badge.refund-completed-badge {
            background: #f5f5f5;
            color: #777;
            border: 1px solid #ddd;
        }
        .status-badge.vaccount-pending-badge {
            background: #fff8eb;
            color: #f0ad4e;
            border: 1px solid #ffe8c1;
        }

        /* 🏁 예약 상품 리스트 디자인 */
        .goods-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        .goods-row {
            display: flex;
            align-items: center;
            gap: 20px;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 12px 18px;
            box-sizing: border-box;
        }
        .goods-img {
            width: 54px;
            height: 54px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #eee;
            background: #fafafa;
            flex-shrink: 0;
        }
        .goods-info-wrap {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .goods-name {
            font-size: var(--fs-sm);
            font-weight: 800;
            color: #333;
        }
        .goods-cat-tag {
            font-size: var(--fs-s);
            font-weight: 700;
            color: #0e3a5b;
            background: #eef7fe;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            align-self: flex-start;
        }

        /* 액션 버튼 그룹 */
        .card-action-bar {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            border-top: 1px dashed #eee;
            padding-top: 20px;
        }
        .btn-action {
            padding: 11px 22px;
            font-size: 0.9rem;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-sizing: border-box;
            border: none;
            text-decoration: none;
            display: inline-block;
        }
        .btn-action-modify {
            background: #f4f7f9;
            color: #0e3a5b;
            border: 1px solid #0e3a5b;
        }
        .btn-action-modify:hover {
            background: #eef3f7;
            transform: translateY(-1px);
        }
        .btn-action-cancel {
            background: #fff;
            color: #d9534f;
            border: 1px solid #d9534f;
        }
        .btn-action-cancel:hover {
            background: #fff5f5;
            transform: translateY(-1px);
        }

        /* 전역 오버레이 로딩 */
        #cancelLoadingOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .cancel-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #eaeaea;
            border-top: 5px solid #d9534f;
            border-radius: 50%;
            animation: cancel-spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes cancel-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 📱 모바일 디바이스 최적화 */
        @media (max-width: 768px) {
            .bookings-wrapper {
                margin: 95px auto 40px auto;
            }
            .bookings-title {
                font-size: var(--fs-st) !important;
            }
            .bookings-subtitle {
                font-size: var(--fs-sm) !important;
                margin-bottom: 30px;
            }
            .expander-header {
                padding: 18px 20px;
            }
            .expander-store {
                font-size: var(--fs-m) !important;
            }
            .expander-summary {
                font-size: var(--fs-sm) !important;
            }
            .expander-content-inner {
                padding: 20px;
            }
            .info-panel {
                padding: 14px 16px;
                font-size: var(--fs-sm) !important;
            }
            .goods-row {
                padding: 10px 12px;
                gap: 12px;
            }
            .goods-img {
                width: 46px;
                height: 46px;
            }
            .goods-name {
                font-size: var(--fs-s) !important;
            }
            .card-action-bar {
                justify-content: stretch;
            }
            .btn-action {
                flex: 1;
                text-align: center;
                font-size: 0.85rem;
                padding: 10px 0;
            }
        }
        
        /* 🏁 리뷰 작성 모달 및 별점 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }
        .modal.open {
            display: flex !important;
        }
        .modal-content {
            background: #fff;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            padding: 30px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 15px 50px rgba(14, 58, 91, 0.15);
            border: 1px solid #eaeaea;
            animation: modalFadeIn 0.3s ease;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #999;
            cursor: pointer;
            transition: color 0.2s;
        }
        .close-modal:hover {
            color: #333;
        }
        .star-rating {
            display: flex;
            gap: 8px;
        }
        .star-rating .star {
            font-size: 2rem;
            color: #ccc;
            cursor: pointer;
            transition: color 0.2s;
        }
        .star-rating .star.hovered,
        .star-rating .star.selected {
            color: #ffb703;
        }
        textarea#reviewContent:focus {
            border-color: #0e3a5b !important;
        }
    </style>
</head>
<body>
    <!-- <header>는 globalWholesale.js가 동적으로 주입합니다. -->

    <div class="bookings-wrapper">
        <h1 class="bookings-title">나의 예약 확인</h1>
        <p class="bookings-subtitle">매장 피팅 예약 목록 및 상세 내역을 실시간으로 확인하실 수 있습니다.</p>

        <!-- 동적 렌더링 컨테이너 -->
        <div id="bookingsContainer">
            <!-- 🏁 로딩 대기 상태 -->
            <div class="loading-state">
                <div class="booking-spinner" style="width: 40px; height: 40px; border: 4px solid #eaeaea; border-top: 4px solid #0e3a5b; border-radius: 50%; animation: cancel-spin 1s linear infinite; margin: 0 auto 15px auto;"></div>
                <p style="color: #666; font-weight: 700;">예약 내역을 불러오고 있습니다. 잠시만 기다려 주세요...</p>
            </div>
        </div>
    </div>

    <!-- 🏁 취소 진행 중 전체화면 잠금 안내 오버레이 -->
    <div id="cancelLoadingOverlay">
        <div class="cancel-spinner"></div>
        <p style="font-size: 1.15rem; font-weight: 700; color: #d9534f; letter-spacing: -0.3px; text-align: center; margin: 0 20px; line-height: 1.5; word-break: keep-all;">고객님의 피팅 예약을 취소 처리 중입니다.<br>잠시만 기다려 주세요...</p>
    </div>

    <!-- 푸터는 globalWholesale.js가 동적으로 주입합니다. -->

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("bookingsContainer");
            const cancelOverlay = document.getElementById("cancelLoadingOverlay");

            // 결제 완료 후 리다이렉트 시 토스트 팝업 알림
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get("payment_success") === "true") {
                alert("결제가 정상적으로 완료되었습니다! 예약 내역에서 결제 완료 상태를 확인하실 수 있습니다.");
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            // 날짜 변환 함수 (YYYY-MM-DDTHH:MM:SS -> YY-MM-DD)
            function formatYYMMDD(isoString) {
                if (!isoString) return "확인 불가";
                try {
                    const d = new Date(isoString);
                    const yy = String(d.getFullYear()).slice(-2);
                    const mm = String(d.getMonth() + 1).padStart(2, '0');
                    const dd = String(d.getDate()).padStart(2, '0');
                    return `${yy}-${mm}-${dd}`;
                } catch (e) {
                    return "확인 불가";
                }
            }

            // 1. 예약 정보 및 병렬 안경 상세 정보 패치 빌더
            function loadBookingsList() {
                container.innerHTML = `
                    <div class="loading-state">
                        <div class="booking-spinner" style="width: 40px; height: 40px; border: 4px solid #eaeaea; border-top: 4px solid #0e3a5b; border-radius: 50%; animation: cancel-spin 1s linear infinite; margin: 0 auto 15px auto;"></div>
                        <p style="color: #666; font-weight: 700;">예약 내역을 불러오고 있습니다. 잠시만 기다려 주세요...</p>
                    </div>
                `;

                fetch("/api/payment/my_bookings")
                .then(res => res.json())
                .then(async bookings => {
                    if (!bookings || bookings.length === 0) {
                        renderEmptyState();
                        return;
                    }

                    container.innerHTML = ""; // 기존 스피너 제거
                    const listWrapper = document.createElement("div");
                    listWrapper.className = "expander-list";

                    // 현재 한국 표준시 (KST) 구하기
                    const kstDate = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Seoul"}));
                    const yyyy = kstDate.getFullYear();
                    const mm = String(kstDate.getMonth() + 1).padStart(2, '0');
                    const dd = String(kstDate.getDate()).padStart(2, '0');
                    const todayStr = `${yyyy}-${mm}-${dd}`;
                    
                    const currentHour = kstDate.getHours();
                    const currentMinute = kstDate.getMinutes();
                    const currentTimeVal = currentHour * 100 + currentMinute;

                    // 예약 목록을 돌며 각각의 아코디언 빌드
                    for (const booking of bookings) {
                        let displayStatus = booking.status;
                        let isPast = false;
                        
                        if (booking.status === "예약 완료") {
                            if (booking.bookingType === 'visit') {
                                if (booking.reservedDate < todayStr) {
                                    isPast = true;
                                } else if (booking.reservedDate === todayStr) {
                                    // 2시간 진행 후 이용 완료로 처리
                                    const startTimeVal = parseInt(booking.reservedTime);
                                    const endTimeVal = startTimeVal + 200; // 2시간 추가
                                    if (currentTimeVal >= endTimeVal) {
                                        isPast = true;
                                    }
                                }
                                if (isPast) {
                                    displayStatus = "이용 완료";
                                }
                            } else if (booking.bookingType === 'store') {
                                // 접수일 기준 7일 경과 시 완료 처리
                                if (booking.createdAt) {
                                    const createdDate = new Date(booking.createdAt);
                                    const diffTime = kstDate - createdDate;
                                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                                    if (diffDays > 7) {
                                        isPast = true;
                                        displayStatus = "이용 완료";
                                    }
                                }
                            }
                        }

                        const isCancelled = (displayStatus === "예약 취소");
                        const isCompleted = (displayStatus === "이용 완료");
                        const isPaid = (displayStatus === "결제 완료");
                        const isCancelRequested = (displayStatus === "취소 요청 완료");
                        const isExchangeRequested = (displayStatus === "교환 요청 완료");
                        const isRefundOrExchangeCompleted = (displayStatus === "환불 및 교환 완료");
                        const isVAccountPending = (displayStatus === "입금 대기");

                        const card = document.createElement("div");
                        card.className = `expander-card ${isCancelled ? 'cancelled' : ''} ${isCompleted ? 'completed' : ''} ${isPaid ? 'paid' : ''} ${isCancelRequested ? 'cancel-req' : ''} ${isExchangeRequested ? 'exchange-req' : ''} ${isRefundOrExchangeCompleted ? 'refund-completed' : ''} ${isVAccountPending ? 'vaccount-pending' : ''}`;
                        card.id = `card-${booking.bookingId}`;

                        // 예약에 포함된 아이템 목록
                        const itemsArr = booking.items || [];
                        
                        // 병렬로 상품 세부 정보 썸네일 패치
                        let firstItemName = "안경 상품";
                        let itemsDetails = [];
                        let hasReview = false;
                        if (itemsArr.length > 0) {
                            try {
                                const reviewStatusPromise = (isCompleted || isPaid || isCancelRequested || isExchangeRequested)
                                    ? fetch(`/api/payment/booking/${booking.bookingId}/review_status`).then(r => r.json())
                                    : Promise.resolve({ has_review: false });
                                const fetchPromises = itemsArr.map(id => 
                                    fetch(`/api/items/${id}`).then(r => r.json())
                                );
                                
                                const [fetchedItems, reviewStatus] = await Promise.all([
                                    Promise.all(fetchPromises),
                                    reviewStatusPromise
                                ]);
                                
                                fetchedItems.forEach((item, idx) => {
                                    if (item && !item.error) {
                                        itemsDetails.push({
                                            name: item.name || "안경 상품",
                                            image: (item.paths && item.paths[0]) ? item.paths[0] : "/static/img/ready.webp",
                                            category: item.category || ""
                                        });
                                    } else {
                                        itemsDetails.push({
                                            name: `안경 상품 (${itemsArr[idx]})`,
                                            image: "/static/img/ready.webp",
                                            category: ""
                                        });
                                    }
                                });

                                if (itemsDetails.length > 0) {
                                    firstItemName = itemsDetails[0].name;
                                }
                                hasReview = reviewStatus && reviewStatus.has_review;
                            } catch (err) {
                                console.error("안경 세부 정보 또는 리뷰 상태 로드 에러:", err);
                            }
                        }

                        const summaryText = `${firstItemName} 포함 총 ${itemsArr.length}개`;
                        const titleText = booking.bookingType === 'visit' ? '1:1 안경 피팅' : (booking.storeName || '파트너 매장');

                        card.innerHTML = `
                            <div class="expander-header">
                                <div class="expander-header-left">
                                    <span class="expander-store">${titleText}</span>
                                    <span class="expander-summary">${summaryText}</span>
                                </div>
                                <svg class="chevron-icon" viewBox="0 0 24 24">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </div>
                            <div class="expander-content">
                                <div class="expander-content-inner">
                                    <div class="section-sub">예약 상세 안내</div>
                                    <div class="info-panel" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                                        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                                            <div style="font-weight: 700; color: #0e3a5b;">예약 ID: ${booking.bookingId}</div>
                                            <span class="status-badge ${isCancelled ? 'cancelled-badge' : ''} ${isCompleted ? 'completed-badge' : ''} ${isPaid ? 'paid-badge' : ''} ${isCancelRequested ? 'cancel-req-badge' : ''} ${isExchangeRequested ? 'exchange-req-badge' : ''} ${isRefundOrExchangeCompleted ? 'refund-completed-badge' : ''} ${isVAccountPending ? 'vaccount-pending-badge' : ''}">${displayStatus}</span>
                                        </div>
                                        ${booking.bookingType === 'visit' ? `
                                            <div style="margin: 2px 0;">방문 예정일: <span class="info-date-val">${booking.reservedDate}</span></div>
                                            <div style="margin: 2px 0;">방문 예정시간: <span class="info-date-val">${booking.reservedTime.slice(0,2)}:${booking.reservedTime.slice(2,4)}</span></div>
                                            <div style="margin: 2px 0;">방문 주소: <span class="info-date-val">${booking.address}</span></div>
                                        ` : `
                                            <div style="margin: 2px 0;">방문 예정매장: <span class="info-date-val">${booking.storeName}</span></div>
                                        `}
                                        <div style="margin-top: 6px; font-size: 0.85rem; color: #888;">접수일자: ${formatYYMMDD(booking.createdAt)}</div>
                                    </div>
                                    
                                    <div class="section-sub">예약 상품</div>
                                    <div class="goods-list">
                                        ${itemsDetails.map(item => `
                                            <div class="goods-row">
                                                <img src="${item.image}" alt="${item.name}" class="goods-img">
                                                <div class="goods-info-wrap">
                                                    <span class="goods-name">${item.name}</span>
                                                    ${item.category ? `<span class="goods-cat-tag">${item.category}</span>` : ''}
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>

                                    ${!isCancelled && !isCompleted && !isPaid && !isCancelRequested && !isExchangeRequested && !isRefundOrExchangeCompleted && !isVAccountPending ? `
                                        <div class="card-action-bar">
                                            <button class="btn-action btn-action-modify" data-id="${booking.bookingId}">예약 수정</button>
                                            ${booking.bookingType === 'visit' && booking.reservedDate === todayStr ? `
                                                <button class="btn-action btn-action-cancel" disabled style="background-color: #f5f5f5; color: #999; border: 1px solid #ddd; cursor: not-allowed; opacity: 0.7;" title="당일 예약 취소는 불가능합니다.">당일 취소 불가</button>
                                            ` : `
                                                <button class="btn-action btn-action-cancel" data-id="${booking.bookingId}">예약 취소</button>
                                            `}
                                        </div>
                                    ` : ''}

                                     ${(isCompleted || isPaid || isExchangeRequested) ? `
                                         <div class="card-action-bar" style="flex-wrap: wrap; gap: 10px;">
                                             ${isCompleted ? `
                                                 <button class="btn-action btn-action-pay" data-id="${booking.bookingId}" style="background-color: #28a745; color: #fff; border: 1px solid #28a745; transition: all 0.2s ease;">피팅 상품 결제하기</button>
                                             ` : ''}
                                             ${isPaid ? `
                                                 <button class="btn-action btn-action-cancel-req" data-id="${booking.bookingId}" style="background-color: #fff; color: #d9534f; border: 1px solid #ffebeb; transition: all 0.2s ease;">결제 취소 요청</button>
                                                 <button class="btn-action btn-action-exchange-req" data-id="${booking.bookingId}" style="background-color: #fff; color: #5f5ce5; border: 1px solid #f0f0ff; transition: all 0.2s ease;">상품 교환 요청</button>
                                             ` : ''}
                                             ${hasReview ? `
                                                 <button class="btn-action" disabled style="background-color: #f5f5f5; color: #999; border: 1px solid #ddd; cursor: not-allowed; opacity: 0.7;">리뷰 작성 완료</button>
                                             ` : `
                                                 <button class="btn-action btn-action-review" data-id="${booking.bookingId}" data-store="${titleText}">리뷰 쓰기</button>
                                             `}
                                         </div>
                                     ` : ''}
                                </div>
                            </div>
                        `;

                        listWrapper.appendChild(card);

                        // 아코디언 클릭 이벤트 연결
                        const header = card.querySelector(".expander-header");
                        const content = card.querySelector(".expander-content");
                        
                        header.addEventListener("click", () => {
                            const isOpen = card.classList.contains("open");
                            
                            // 모든 다른 카드를 닫음 (아코디언 기본 동작)
                            document.querySelectorAll(".expander-card").forEach(c => {
                                if (c !== card) {
                                    c.classList.remove("open");
                                    c.querySelector(".expander-content").style.maxHeight = null;
                                }
                            });

                            if (isOpen) {
                                card.classList.remove("open");
                                content.style.maxHeight = null;
                            } else {
                                card.classList.add("open");
                                content.style.maxHeight = content.scrollHeight + "px";
                            }
                        });

                        // 🏁 액션 버튼 이벤트 연결
                        if (!isCancelled && !isCompleted && !isPaid && !isCancelRequested && !isExchangeRequested && !isRefundOrExchangeCompleted && !isVAccountPending) {
                            const btnModify = card.querySelector(".btn-action-modify");
                            const btnCancel = card.querySelector(".btn-action-cancel");

                            // 예약 수정: Connect(/contact) 페이지 이동
                            btnModify.addEventListener("click", (e) => {
                                e.stopPropagation(); // 헤더 토글 이벤트 방지
                                location.href = `/contact?modify_booking=${booking.bookingId}`;
                            });

                            // 예약 취소: 비동기 API 통신 연동
                            if (btnCancel && !btnCancel.disabled) {
                                btnCancel.addEventListener("click", (e) => {
                                    e.stopPropagation(); // 헤더 토글 이벤트 방지
                                    if (confirm("정말로 이 예약을 취소하시겠습니까?\n취소 후에는 복구가 불가합니다.")) {
                                        executeCancel(booking.bookingId);
                                    }
                                });
                            }
                        }

                        // 🏁 결제 버튼 이벤트 연결
                        if (isCompleted) {
                            const btnPay = card.querySelector(".btn-action-pay");
                            if (btnPay) {
                                btnPay.addEventListener("click", (e) => {
                                    e.stopPropagation(); // 아코디언 토글 방지
                                    location.href = `/general/booking_checkout?booking_id=${booking.bookingId}`;
                                });
                                btnPay.addEventListener("mouseenter", (e) => {
                                    e.target.style.backgroundColor = "#218838";
                                    e.target.style.borderColor = "#1e7e34";
                                    e.target.style.transform = "translateY(-1px)";
                                });
                                btnPay.addEventListener("mouseleave", (e) => {
                                    e.target.style.backgroundColor = "#28a745";
                                    e.target.style.borderColor = "#28a745";
                                    e.target.style.transform = "none";
                                });
                            }
                        }

                        // 🏁 B2C 일반 고객 결제 취소 / 상품 교환 요청 버튼 이벤트 연결
                        if (isPaid) {
                            const btnCancelReq = card.querySelector(".btn-action-cancel-req");
                            const btnExchangeReq = card.querySelector(".btn-action-exchange-req");

                            if (btnCancelReq) {
                                btnCancelReq.addEventListener("click", (e) => {
                                    e.stopPropagation(); // 아코디언 토글 방지
                                    if (confirm("정말로 결제 취소 요청을 보내시겠습니까?\n관리자 확인 후 처리가 완료됩니다.")) {
                                        executeCancelRequest(booking.bookingId);
                                    }
                                });
                            }

                            if (btnExchangeReq) {
                                btnExchangeReq.addEventListener("click", (e) => {
                                    e.stopPropagation(); // 아코디언 토글 방지
                                    if (confirm("정말로 상품 교환 요청을 보내시겠습니까?\n관리자 확인 후 처리가 완료됩니다.")) {
                                        executeExchangeRequest(booking.bookingId);
                                    }
                                });
                            }
                        }

                        // 🏁 리뷰 쓰기 버튼 이벤트 연결
                        if (isCompleted || isPaid || isExchangeRequested) {
                            const btnReview = card.querySelector(".btn-action-review");
                            if (btnReview) {
                                btnReview.addEventListener("click", (e) => {
                                    e.stopPropagation(); // 아코디언 토글 방지
                                    openReviewModal(booking.bookingId, btnReview.getAttribute("data-store"));
                                });
                            }
                        }
                    }

                    container.appendChild(listWrapper);
                })
                .catch(err => {
                    console.error("예약 내역 로드 중 예외 발생:", err);
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">⚠️</div>
                            <div class="empty-text">예약 데이터를 가져오지 못했습니다.</div>
                            <p style="color: #666; margin-bottom: 20px;">서버와의 연결 상태를 확인하고 잠시 후 다시 로드해 주세요.</p>
                            <button onclick="location.reload()" class="btn-go-shop" style="border:none; cursor:pointer;">다시 시도하기</button>
                        </div>
                    `;
                });
            }

            // 2. 예약 취소 비동기 API 전송 모듈
            function executeCancel(bookingId) {
                cancelOverlay.style.display = "flex";

                fetch(`/api/payment/booking/${bookingId}/cancel`, {
                    method: "POST"
                })
                .then(res => res.json())
                .then(data => {
                    cancelOverlay.style.display = "none";
                    if (data.status === "success") {
                        alert("예약이 정상적으로 취소 처리되었습니다.");
                        loadBookingsList(); // 리스트 새로고침
                    } else {
                        alert(`취소 실패: ${data.message}`);
                    }
                })
                .catch(err => {
                    cancelOverlay.style.display = "none";
                    console.error("취소 전송 에러:", err);
                    alert("서버와 통신 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
                });
            }

            // 3. 결제 취소 요청 전송 모듈
            function executeCancelRequest(bookingId) {
                cancelOverlay.style.display = "flex";

                fetch(`/api/payment/booking_order/cancel_request`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ bookingId: bookingId })
                })
                .then(res => res.json())
                .then(data => {
                    cancelOverlay.style.display = "none";
                    if (data.status === "success") {
                        alert(data.message || "취소 요청이 접수되었습니다.");
                        loadBookingsList(); // 리스트 새로고침
                    } else {
                        alert(`요청 실패: ${data.message}`);
                    }
                })
                .catch(err => {
                    cancelOverlay.style.display = "none";
                    console.error("취소 요청 전송 에러:", err);
                    alert("서버와 통신 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
                });
            }

            // 4. 상품 교환 요청 전송 모듈
            function executeExchangeRequest(bookingId) {
                cancelOverlay.style.display = "flex";

                fetch(`/api/payment/booking_order/exchange_request`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ bookingId: bookingId })
                })
                .then(res => res.json())
                .then(data => {
                    cancelOverlay.style.display = "none";
                    if (data.status === "success") {
                        alert(data.message || "교환 요청이 접수되었습니다.");
                        loadBookingsList(); // 리스트 새로고침
                    } else {
                        alert(`요청 실패: ${data.message}`);
                    }
                })
                .catch(err => {
                    cancelOverlay.style.display = "none";
                    console.error("교환 요청 전송 에러:", err);
                    alert("서버와 통신 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
                });
            }

            // 빈 목록 상태 렌더러
            function renderEmptyState() {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📅</div>
                        <div class="empty-text">예약하신 내역이 존재하지 않습니다.</div>
                        <p style="color: #666; margin-bottom: 25px; line-height:1.5;">아무래도 안경의 품격 있는 1:1 맞춤 피팅 예약을 진행해 보세요.</p>
                        <a href="/" class="btn-go-shop">안경 둘러보기</a>
                    </div>
                `;
            }

            // 🏁 5. 리뷰 관련 모달 스크립트 모듈
            let currentBookingId = null;
            let currentRating = 0;

            const reviewModal = document.getElementById("reviewModal");
            const reviewStoreInput = document.getElementById("reviewStoreName");
            const reviewContentArea = document.getElementById("reviewContent");
            const closeReviewModalBtn = document.getElementById("closeReviewModal");
            const btnCancelReview = document.getElementById("btnCancelReview");
            const btnSubmitReview = document.getElementById("btnSubmitReview");
            const stars = document.querySelectorAll("#reviewStarRating .star");

            // 리뷰 모달 열기
            function openReviewModal(bookingId, storeName) {
                currentBookingId = bookingId;
                currentRating = 0;
                reviewStoreInput.value = storeName;
                reviewContentArea.value = "";
                resetStars();
                reviewModal.classList.add("open");
            }

            // 리뷰 모달 닫기
            function closeReviewModalWindow() {
                reviewModal.classList.remove("open");
                currentBookingId = null;
                currentRating = 0;
            }

            function resetStars() {
                stars.forEach(s => {
                    s.classList.remove("selected", "hovered");
                });
            }

            // 별점 별 인터랙션
            stars.forEach(star => {
                star.addEventListener("click", () => {
                    currentRating = parseInt(star.getAttribute("data-value"));
                    highlightStars(currentRating);
                });

                star.addEventListener("mouseenter", () => {
                    const hoverVal = parseInt(star.getAttribute("data-value"));
                    stars.forEach((s, idx) => {
                        if (idx < hoverVal) {
                            s.classList.add("hovered");
                        } else {
                            s.classList.remove("hovered");
                        }
                    });
                });

                star.addEventListener("mouseleave", () => {
                    stars.forEach(s => s.classList.remove("hovered"));
                });
            });

            function highlightStars(rating) {
                stars.forEach((s, idx) => {
                    if (idx < rating) {
                        s.classList.add("selected");
                    } else {
                        s.classList.remove("selected");
                    }
                });
            }

            closeReviewModalBtn.addEventListener("click", closeReviewModalWindow);
            btnCancelReview.addEventListener("click", closeReviewModalWindow);

            // 리뷰 모달 외부 클릭 시 닫기
            window.addEventListener("click", (e) => {
                if (e.target === reviewModal) {
                    closeReviewModalWindow();
                }
            });

            // 리뷰 제출 API 전송
            btnSubmitReview.addEventListener("click", () => {
                const contentText = reviewContentArea.value.trim();
                
                if (currentRating === 0) {
                    alert("별점을 선택해 주세요!");
                    return;
                }
                if (contentText.length < 5) {
                    alert("후기 내용은 최소 5자 이상 작성해 주세요.");
                    return;
                }

                btnSubmitReview.disabled = true;
                btnSubmitReview.textContent = "등록 중...";

                fetch("/api/payment/review", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        bookingId: currentBookingId,
                        content: contentText,
                        rating: currentRating
                    })
                })
                .then(res => res.json())
                .then(data => {
                    btnSubmitReview.disabled = false;
                    btnSubmitReview.textContent = "등록하기";
                    if (data.status === "success") {
                        alert("소중한 리뷰가 정상적으로 등록되었습니다!");
                        closeReviewModalWindow();
                        loadBookingsList(); // 목록 새로고침
                    } else {
                        alert(`등록 실패: ${data.message || data.detail}`);
                    }
                })
                .catch(err => {
                    btnSubmitReview.disabled = false;
                    btnSubmitReview.textContent = "등록하기";
                    console.error("리뷰 제출 에러:", err);
                    alert("서버와 통신 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
                });
            });

            // 초기 실행
            loadBookingsList();
        });
    </script>

    <!-- 리뷰 작성 모달 -->
    <div id="reviewModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeReviewModal">&times;</span>
            <h2 style="margin-bottom: 20px; font-weight: 800; color: #0e3a5b;">피팅 서비스 후기 작성</h2>
            <div style="margin-bottom: 15px;">
                <label style="font-weight: 700; color: #555; display: block; margin-bottom: 5px;">방문 매장</label>
                <input type="text" id="reviewStoreName" readonly style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; font-weight: bold; color: #333; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="font-weight: 700; color: #555; display: block; margin-bottom: 8px;">서비스 만족도 (별점)</label>
                <div class="star-rating" id="reviewStarRating">
                    <span class="star" data-value="1">★</span>
                    <span class="star" data-value="2">★</span>
                    <span class="star" data-value="3">★</span>
                    <span class="star" data-value="4">★</span>
                    <span class="star" data-value="5">★</span>
                </div>
            </div>
            <div style="margin-bottom: 25px;">
                <label style="font-weight: 700; color: #555; display: block; margin-bottom: 8px;">후기 내용 (최소 5자)</label>
                <textarea id="reviewContent" placeholder="피팅 서비스에 대한 솔직한 후기를 남겨주세요." style="width: 100%; height: 120px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; resize: none; box-sizing: border-box; font-family: inherit; font-size: 0.95rem;"></textarea>
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="button" id="btnCancelReview" class="btn-action" style="flex: 1; background: #fff; border: 1px solid #ddd; color: #666; cursor: pointer; border-radius: 8px; padding: 12px; font-weight: 700;">취소</button>
                <button type="button" id="btnSubmitReview" class="btn-action" style="flex: 1; background: #0e3a5b; border: 1px solid #0e3a5b; color: #fff; cursor: pointer; border-radius: 8px; padding: 12px; font-weight: 700;">등록하기</button>
            </div>
        </div>
    </div>

    <script src="/static/globalWholesale.js?v=71.0"></script>
</body>
</html>
