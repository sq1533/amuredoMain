<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 아무레도 검색엔진 최적화(SEO) 및 SNS 공유 설정 -->
    <title>통합 인증 센터 - 아무래도 안경</title>
    <meta name="description" content="분위기와 억양을 디자인을 디자인합니다. 아무래도 안경, 본질의 아름다움을 추구합니다">
    <link rel="icon" href="/static/img/icon.webp" type="image/webp">
    <!-- 전역 메인 폰트: 프리텐다드(Pretendard) 연결 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="/static/style.css?v=52.0">
    <style>
/* Global Grid based Login/Register */

#loginView {
    display: grid !important;
    min-height: 100vh;
    background-color: #F7F7F7;
}

/* PC Layout (12 columns) */
@media (min-width: 1025px) {
    #loginFormPane {
        grid-column: 5 / span 4 !important;
        grid-row: 2 !important;
    }
    #switchRegisterBtn {
        grid-column: 5 / span 4 !important;
        grid-row: 3 !important;
    }
}

/* Wild Mobile / Tablet Layout (6 columns) */
@media (min-width: 641px) and (max-width: 1024px) {
    #loginFormPane {
        grid-column: 2 / span 4 !important;
        grid-row: 2 !important;
    }
    #switchRegisterBtn {
        grid-column: 2 / span 4 !important;
        grid-row: 3 !important;
    }
}

/* Mobile Layout (4 columns) */
@media (max-width: 640px) {
    #loginFormPane {
        grid-column: 1 / span 4 !important;
        grid-row: 2 !important;
        padding: 20px !important;
    }
    #switchRegisterBtn {
        grid-column: 1 / span 4 !important;
        grid-row: 3 !important;
    }
}

/* Common layout classes */
.auth-form-container {
    border: 1px solid #eaeaea;
    background: transparent;
    padding: 40px;
    box-sizing: border-box;
    border-radius: 8px;
    position: relative;
    z-index: 1; /* Force Stacking Context to prevent overlays from slipping behind the grandparent background */
    overflow: hidden;
    display: flex !important;
    flex-direction: column;
    justify-content: flex-start;
    color: #0e3a5b;
    transition: color 0.4s ease;
}

.switch-auth-btn {
    border: 1px solid #eaeaea;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    letter-spacing: 4px;
    transition: background 0.2s;
    font-weight: bold;
    color: #0e3a5b;
    text-decoration: none;
    border-radius: 8px;
    align-self: start;
    margin-top: 15px !important;
    padding: 20px;
}

/* Wave Overlays */
.auth-bg-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    transition: clip-path 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}
.bg-blue {
    background: #0e3a5b;
    z-index: -2;
    clip-path: circle(0% at 50% 50%);
}
.bg-white {
    background: #F7F7F7;
    z-index: -1;
    clip-path: circle(150% at 50% 50%);
}

/* General Styling */
.auth-title {
    font-size: var(--fs-t);
    font-weight: 800;
    color: inherit;
    margin-bottom: 8px;
    text-align: center;
    letter-spacing: -0.5px;
    transition: color 0.4s ease;
}
.auth-subtitle {
    font-size: var(--fs-m);
    color: inherit;
    opacity: 0.8;
    margin-bottom: clamp(14px, 2vh, 18px); /* 절반 수준(14~18px)의 가변성 반응형 마진 설정 */
    text-align: center;
    word-break: keep-all;
    transition: color 0.4s ease;
}

/* Tabs */
.auth-tabs {
    display: flex;
    border-bottom: 1px solid rgba(14, 58, 91, 0.2);
    margin-bottom: 20px; /* 선택 버튼과 하위 컨테이너 간의 여백을 20px로 설정 */
    transition: border-color 0.4s ease;
}
.auth-tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    font-size: var(--fs-m) !important; /* 가변성 rem 단위로 변경 */
    font-weight: bold;
    color: rgba(14, 58, 91, 0.4);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: color 0.4s, border-bottom-color 0.4s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
}
.auth-tab:hover {
    color: #0e3a5b;
}
.auth-tab.active {
    color: #0e3a5b;
    border-bottom-color: #0e3a5b;
}

/* Wholesale Active State (Inverted Theme) */
.wholesale-active {
    color: #F7F7F7;
}
.wholesale-active .auth-tabs {
    border-bottom-color: rgba(247, 247, 247, 0.2);
}
.wholesale-active .auth-tab {
    color: rgba(247, 247, 247, 0.45);
}
.wholesale-active .auth-tab:hover {
    color: #F7F7F7;
}
.wholesale-active .auth-tab.active {
    color: #F7F7F7 !important;
    border-bottom-color: #F7F7F7 !important;
}

/* Form Fields for Wholesale */
.form-group {
    width: 85%;
    margin-left: auto;
    margin-right: auto;
    margin-bottom: clamp(8px, 1.2vw, 12px); /* 인풋↔다음 라벨 간격: PC 기준 10px 가변성 */
    display: flex;
    flex-direction: column;
    gap: 0 !important; /* 전역 style.css의 gap: 0.8rem 충돌 방지 — margin-bottom으로 개별 제어 */
}
.form-group label {
    margin-bottom: clamp(2px, 0.3vw, 4px) !important; /* 라벨↔인풋 간격: PC 기준 2px 가변성 */
    line-height: 1;
    font-size: var(--fs-m) !important; /* 모든 뷰포트에서 가변성 1.0rem으로 일치화 */
    font-weight: bold;
    color: inherit;
    display: block;
}
.form-group input[type="email"],
.form-group input[type="password"] {
    margin-top: 0 !important;
    width: 100% !important;
    height: auto !important; /* height 값 충돌 방지 */
    aspect-ratio: 10 / 1.5 !important; /* 가로 세로 10:1.5 비율 강제 고정 */
    padding: 0 12px !important; /* 위아래 패딩 제거하여 aspect-ratio가 올바르게 작동하도록 함 */
    border: 1px solid #ccc !important;
    border-radius: 4px !important;
    outline: none !important;
    box-sizing: border-box !important;
    transition: border-color 0.2s !important;
}
.wholesale-active .form-group input:focus {
    border-color: #F7F7F7;
    box-shadow: 0 0 0 3px rgba(247, 247, 247, 0.25);
}
.form-group input::placeholder {
    font-size: var(--fs-s) !important;
}

/* Buttons */
.submit-btn {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    width: 85% !important;
    height: auto !important;
    aspect-ratio: 10 / 1.5 !important; /* 가로 세로 10:1.5 비율 강제 고정 */
    padding: 0 !important; /* 위아래 패딩 제거하여 aspect-ratio 작동 보장 */
    margin-left: auto;
    margin-right: auto;
    margin-top: clamp(8px, 1.2vw, 12px); /* 인풋↔버튼 간격: PC 기준 10px 가변성 */
    background: #0e3a5b;
    color: #fff;
    border: none;
    border-radius: 0;
    box-shadow: none;
    font-size: var(--fs-m) !important; /* 1.1rem에서 1.0rem 가변성으로 통일 */
    font-weight: 700;
    cursor: pointer;
    box-sizing: border-box;
    transition: background 0.3s;
}
.wholesale-active .submit-btn {
    background: #F1C5A4 !important;
    color: #0e3a5b !important;
}
.wholesale-active .submit-btn:hover {
    background: #f8dfcb !important;
    color: #0b2d47 !important;
}

/* Customer SNS Panel (5-split, Vertically Centered) */
.customer-panel {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto 1fr;
    align-items: center;
    justify-items: center;
    flex: 1;
    padding: 20px 0;
}
.sns-circle-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
}
.sns-circle-btn:hover {
    transform: none !important;
}
</style>
</head>
<body>
    
    <!-- 로그인 뷰 -->
    <div id="loginView" class="main-grid-layout" style="display: grid; min-height: 100vh; background-color: #F7F7F7; padding-bottom: 50px;">
        <!-- 상단 1~2행은 자동 여백 -->
        <div id="loginFormPane" class="auth-form-container" style="grid-column: 5 / span 4; border: 1px solid #eaeaea; background: transparent; padding: 40px; box-sizing: border-box; overflow-y: auto; border-radius: 8px; position: relative; overflow: hidden;">
            <!-- 파도 애니메이션을 품을 이중 오버레이 슬라이더 레이어 -->
                <div class="auth-bg-overlay bg-blue" id="loginBgOverlay"></div>
                <div class="auth-bg-overlay bg-white" id="loginBgOverlayWhite"></div>

                <h1 class="auth-title">AMUREDO 로그인</h1>
                <p class="auth-subtitle login-subtitle">환영합니다</p>

                <!-- 🏁 상단 전환 탭 버튼 2행 스위치 -->
                <div class="auth-tabs">
                    <button class="auth-tab active" id="loginTabCustomer">고객 로그인</button>
                    <button class="auth-tab" id="loginTabWholesale">사장님 로그인</button>
                </div>

                <!-- 🏁 일반 고객용 SNS 로그인 카드 패널 (1행 2열 원형 구조) -->
                <div class="customer-panel" id="loginPanelCustomer">
                    <div></div>
                    <div style="grid-column: 2;"><button class="sns-circle-btn btn-naver" id="naverLoginBtn" title="네이버로 로그인">
                        <img src="/static/img/naver.svg" alt="Naver Login" class="sns-svg-icon" style="width: 100%; height: 100%; object-fit: contain; padding: 4px; box-sizing: border-box;">
                    </button></div>
                    <div></div>
                    <div style="grid-column: 4;"><button class="sns-circle-btn btn-kakao" id="kakaoLoginBtn" title="카카오로 로그인">
                        <img src="/static/img/kakao.svg" alt="Kakao Login" class="sns-svg-icon" style="width: 100%; height: 100%; object-fit: contain; padding: 4px; box-sizing: border-box;">
                    </button></div>
                    <div></div>
                  </div>
                  <div class="wholesale-panel" id="loginPanelWholesale" style="display: none;">
                    <div class="wholesale-inner-container">
                        <form id="loginForm">
                            <div class="form-group">
                                <label for="loginEmail">이메일</label>
                                <input type="email" id="loginEmail" name="email" placeholder="example@email.com" required>
                            </div>
                            <div class="form-group">
                                <label for="loginPassword">비밀번호</label>
                                <input type="password" id="loginPassword" name="password" placeholder="비밀번호를 입력하세요" required>
                            </div>
                            <button type="submit" id="loginSubmitBtn" class="submit-btn">로그인</button>
                        </form>
                    </div>
                </div>
            </div>
            <a id="switchRegisterBtn" href="/register" class="switch-auth-btn">회원가입</a>
        </div>

    <!-- 🏁 커스텀 팝업 (모달) UI (이원화 통합 공통 제어) -->
    <div id="customModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(3px);">
        <div style="background: white; padding: clamp(24px, 5vw, 40px) clamp(20px, 4vw, 30px); border-radius: clamp(12px, 2vw, 16px); box-shadow: 0 15px 40px rgba(0,0,0,0.2); width: clamp(280px, 80vw, 380px); text-align: center; transform: translateY(-20px); animation: modalFadeIn 0.3s forwards;">
            <div id="modalIcon" style="font-size: 2.5rem; margin-bottom: 15px;">👋</div>
            <div id="modalTitle" style="font-size: 1.3rem; font-weight: 800; color: #0e3a5b; margin-bottom: 10px;">알림</div>
            <div id="modalMessage" style="font-size: 0.95rem; color: #666; margin-bottom: 30px; line-height: 1.5; word-break: keep-all;">메시지 내용</div>
            <button id="modalConfirmBtn" style="width: 100%; padding: clamp(10px, 2vw, 14px); background: #0e3a5b; color: white; border: none; border-radius: clamp(6px, 1vw, 8px); font-size: 1.05rem; font-weight: bold; cursor: pointer; transition: background 0.3s;">확인</button>
        </div>
    </div>

    <!-- 회원가입 뷰 -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 0. 방문 페이지(Referrer) 기록
            const referrer = document.referrer;
            if (referrer && !referrer.includes("/login") && !referrer.includes("/register")) {
                try {
                    const refUrl = new URL(referrer);
                    if (refUrl.host === window.location.host) {
                        sessionStorage.setItem("login_redirect_to", refUrl.pathname + refUrl.search);
                    }
                } catch (e) {
                    if (!referrer.startsWith("http")) {
                        sessionStorage.setItem("login_redirect_to", referrer);
                    }
                }
            }

            // 1. 공통 모달 함수
            function showModal(type, title, message, callback) {
                const modal = document.getElementById('customModal');
                const icon = document.getElementById('modalIcon');
                const titleEl = document.getElementById('modalTitle');
                const messageEl = document.getElementById('modalMessage');
                const confirmBtn = document.getElementById('modalConfirmBtn');

                if (type === 'success') {
                    icon.textContent = '✓';
                    titleEl.style.color = '#0e3a5b';
                    confirmBtn.style.background = '#0e3a5b';
                } else {
                    icon.textContent = '!';
                    titleEl.style.color = '#d32f2f';
                    confirmBtn.style.background = '#d32f2f';
                }

                titleEl.textContent = title;
                messageEl.innerHTML = message;
                modal.style.display = 'flex';

                const newBtn = confirmBtn.cloneNode(true);
                confirmBtn.parentNode.replaceChild(newBtn, confirmBtn);

                newBtn.addEventListener('click', () => {
                    modal.style.display = 'none';
                    if (callback) callback();
                });
            }

            // 3. 로그인 패널 일반/도매 전환 애니메이션
            const loginTabCustomer = document.getElementById("loginTabCustomer");
            const loginTabWholesale = document.getElementById("loginTabWholesale");
            const loginPanelCustomer = document.getElementById("loginPanelCustomer");
            const loginPanelWholesale = document.getElementById("loginPanelWholesale");
            const loginContainer = document.getElementById("loginFormPane");
            const loginBgOverlay = document.getElementById("loginBgOverlay");
            const loginBgOverlayWhite = document.getElementById("loginBgOverlayWhite");

            if (loginTabCustomer && loginTabWholesale) {
                loginTabCustomer.addEventListener("click", (e) => {
                    if (!loginTabCustomer.classList.contains("active")) {
                        loginTabCustomer.classList.add("active");
                        loginTabWholesale.classList.remove("active");

                        // Calculate clicked position relative to container
                        const rect = loginContainer.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;

                        if (loginBgOverlayWhite && loginBgOverlay) {
                            // 1. Put white overlay on top (z-index: -1) and blue behind (z-index: -2)
                            loginBgOverlayWhite.style.zIndex = "-1";
                            loginBgOverlay.style.zIndex = "-2";

                            // 2. Expand white overlay from click position
                            loginBgOverlayWhite.style.transition = "none";
                            loginBgOverlayWhite.style.clipPath = `circle(0% at ${x}px ${y}px)`;
                            loginBgOverlayWhite.offsetHeight; // trigger reflow
                            loginBgOverlayWhite.style.transition = "clip-path 0.8s cubic-bezier(0.4, 0, 0.2, 1)";
                            loginBgOverlayWhite.style.clipPath = `circle(150% at ${x}px ${y}px)`;
                        }

                        // Swap form panels instantly to align with the visual sweep
                        if (loginContainer) loginContainer.classList.remove("wholesale-active");
                        if (loginPanelCustomer) loginPanelCustomer.style.display = "grid";
                        if (loginPanelWholesale) loginPanelWholesale.style.display = "none";
                    }
                });

                loginTabWholesale.addEventListener("click", (e) => {
                    if (!loginTabWholesale.classList.contains("active")) {
                        loginTabWholesale.classList.add("active");
                        loginTabCustomer.classList.remove("active");

                        // Calculate clicked position relative to container
                        const rect = loginContainer.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;

                        if (loginBgOverlay && loginBgOverlayWhite) {
                            // 1. Put blue overlay on top (z-index: -1) and white behind (z-index: -2)
                            loginBgOverlay.style.zIndex = "-1";
                            loginBgOverlayWhite.style.zIndex = "-2";

                            // 2. Expand blue overlay from click position
                            loginBgOverlay.style.transition = "none";
                            loginBgOverlay.style.clipPath = `circle(0% at ${x}px ${y}px)`;
                            loginBgOverlay.offsetHeight; // trigger reflow
                            loginBgOverlay.style.transition = "clip-path 0.8s cubic-bezier(0.4, 0, 0.2, 1)";
                            loginBgOverlay.style.clipPath = `circle(150% at ${x}px ${y}px)`;
                        }

                        // Swap form panels instantly to align with the visual sweep
                        if (loginContainer) loginContainer.classList.add("wholesale-active");
                        if (loginPanelCustomer) loginPanelCustomer.style.display = "none";
                        if (loginPanelWholesale) loginPanelWholesale.style.display = "block";
                    }
                });
            }

            // 4. 도매 고객 로그인 폼 제출(Submit) 및 팝업 처리
            const loginForm = document.getElementById("loginForm");
            if (loginForm) {
                loginForm.addEventListener("submit", async (e) => {
                    e.preventDefault();
                    const submitBtn = document.getElementById("loginSubmitBtn");
                    if (!submitBtn) return;
                    
                    submitBtn.disabled = true;
                    const originalText = submitBtn.innerText;
                    submitBtn.innerText = "로그인 중...";

                    const formData = new FormData(e.target);

                    try {
                        const response = await fetch("/api/user/login", {
                            method: "POST",
                            body: formData
                        });
                        const result = await response.json();

                        if (result.status === "success") {
                            // 이전 방문 페이지 기록이 있으면 로그인 성공 후 거기로 리다이렉트
                            const redirectTo = sessionStorage.getItem("login_redirect_to") || "/antioch";
                            showModal('success', '로그인 성공', result.message, () => {
                                sessionStorage.removeItem("login_redirect_to");
                                location.href = redirectTo;
                            });
                        } else {
                            showModal('error', '로그인 실패', result.message);
                        }
                    } catch (error) {
                        showModal('error', '시스템 에러', '알 수 없는 오류가 발생했습니다.');
                    } finally {
                        submitBtn.disabled = false;
                        submitBtn.innerText = originalText;
                    }
                });
            }

            // 5. 일반고객 소셜 로그인 연동
            const naverLoginBtn = document.getElementById("naverLoginBtn");
            const kakaoLoginBtn = document.getElementById("kakaoLoginBtn");

            if (naverLoginBtn) {
                naverLoginBtn.addEventListener("click", () => {
                    const redirectTo = sessionStorage.getItem("login_redirect_to") || "";
                    let url = "/api/user/login/naver";
                    if (redirectTo) {
                        url += `?next=${encodeURIComponent(redirectTo)}`;
                    }
                    location.href = url;
                });
            }

            if (kakaoLoginBtn) {
                kakaoLoginBtn.addEventListener("click", () => {
                    const redirectTo = sessionStorage.getItem("login_redirect_to") || "";
                    let url = "/api/user/login/kakao";
                    if (redirectTo) {
                        url += `?next=${encodeURIComponent(redirectTo)}`;
                    }
                    location.href = url;
                });
            }
        });
    </script>
    <script src="/static/globalWholesale.js?v=52.0"></script>
</body>
</html>
